syntax = "proto3";

package w17;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/w17;w17pb";

// REV-017 (2026-05-07) — domain-level REST registry. Replaces
// the inline `(w17.http)` annotations on gRPC methods that
// shipped through iter-1..3.
//
// Why a registry instead of inline annotations:
//   - gRPC service definitions stay a pure behavior contract
//     (req → resp + streaming kind + business semantics).
//     Whether a method is also exposed over REST is a transport
//     concern, orthogonal to the gRPC shape.
//   - One file per API surface gives big-picture view: open
//     `proto/domains/<domain>/rest.proto` to see every URL the
//     gateway mounts.
//   - Multiple surfaces with distinct prefixes / auth /
//     middleware (`rest.proto`, `rest_admin.proto`,
//     `rest_partner.proto`) compose naturally — each file is a
//     separate API surface.
//   - API versioning is trivial: `rest_v1.proto` + `rest_v2.proto`
//     side by side, no annotation duplication on methods.
//
// Driven by `srcgo/domains/gateway/parser`: every loaded
// `.proto` carrying `option (w17.rest_api) = { ... }` becomes
// one mux in the emitted REST gateway binary.

extend google.protobuf.FileOptions {
  // (w17.rest_api) — file-level option declaring this file as
  // a REST surface registry. The author wires which gRPC
  // methods are exposed at which URLs by referencing them via
  // string `ref` paths. The file declares ZERO messages — it's
  // a sentinel, similar to `w17.proto` cascade files (REV-004).
  RestApi rest_api = 50110;
}

// RestApi declares one REST surface — one logical API exposed
// at one prefix, with its own identity (name + version), its
// own auth method, and a tree of grouped endpoints / streams.
//
// Multiple `rest_*.proto` files in the same domain produce
// multiple surfaces; each surface gets its own gateway mux at
// codegen time (or its own gateway binary, depending on deploy
// config — to be decided when we ship the multi-surface
// gateway main).
message RestApi {
  // Logical name of the surface — "public" / "admin" /
  // "partner" / "internal". Surfaces in tooling
  // (catalog / OpenAPI summary) and in error diagnostics. Must
  // be a snake_case identifier.
  string name = 1;

  // Version of this surface — "v1" / "v2" / "2026-05-07". Free-
  // form string; surfaces in OpenAPI's `info.version`. Used
  // alongside `name` to disambiguate surfaces in catalog
  // output. Convention is to keep one surface per major
  // version: `rest_v1.proto` + `rest_v2.proto` rather than
  // mixing.
  string version = 2;

  // URL prefix prepended to every group's prefix (and thus
  // every endpoint's path). Convention: `/api/<version>` —
  // e.g. "/api/v1". Empty = no prefix; URLs start at the
  // group's prefix.
  string prefix = 3;

  // Human-readable description of the API surface. Surfaces
  // verbatim in OpenAPI `info.description`. Empty = no
  // description block; OpenAPI still emits.
  string description = 4;

  // REV-146 — authentication methods for this surface. Each
  // entry references one RPC (by `<module>.<Service>.<Method>`
  // ref) and declares which credential token types it handles.
  // Empty list = surface has no auth middleware; endpoints on
  // such a surface still emit handler code but skip the auth
  // call entirely.
  //
  // Dispatch is by token type (Bearer / Basic / catch-all). The
  // gateway peeks the request's Authorization scheme, picks the
  // first `auth_methods[]` entry whose `token_types` covers the
  // classified scheme, and calls that method. Same-type
  // fall-through is allowed (two Bearer-handling methods → try
  // in declaration order, first success wins); cross-type
  // fall-through never happens (the whole point of the scheme
  // peek is to not invoke a Basic backend when the credential is
  // clearly Bearer). When the classified scheme matches no
  // method (including no ANY-typed catch-all), the request
  // returns 401 without invoking any backend.
  //
  // The named methods must:
  //   - take a request type with at least one field that holds
  //     the bearer header (validated at parse time via the same
  //     path-template binding rules as endpoints), and
  //   - return a response type carrying `repeated int32
  //     permission_ids` whenever any model or endpoint on this
  //     surface has effective ACL. REV-146 permissions are
  //     deterministic integer ids allocated in the lock, and the
  //     generated gate calls `GetPermissionIds()` on this
  //     response.
  //
  //     This once read "a `repeated string permissions` field
  //     (validated at parse time)", which is wrong three times:
  //     wrong name, wrong type, and nothing validates it — an
  //     auth method written to that description produces a
  //     bundle whose ACL gate does not compile. Not silent, but
  //     a documented contract that cannot work. The check itself
  //     belongs where the lock is readable (the codegen service,
  //     beside the default_language check) and is not written
  //     yet.
  //
  // The auth methods themselves are implicitly excluded from the
  // auth middleware (otherwise the call would recurse).
  repeated AuthMethod auth_methods = 5;

  // Logical sub-groupings of endpoints — typically one group
  // per resource family ("users", "tasks", …) with its own
  // sub-prefix. Empty list = empty surface (parser warns; the
  // file still produces a mux but it has zero routes).
  repeated RestGroup groups = 6;

  // REV-020 — HTTP→gRPC metadata propagation across every
  // endpoint of this surface. Tracing / correlation IDs /
  // baggage. Headers DO NOT appear on request msgs; storage
  // handlers read them via `metadata.FromIncomingContext`.
  // Empty (uninitialized) = use W3C tracing defaults
  // (X-Request-Id, traceparent, tracestate, baggage). Set
  // `extend_defaults: true` to ADD to the default set rather
  // than override it.
  MetadataPropagation metadata_propagation = 7;

  // REV-149 — i18n default locale for this REST surface. Empty
  // = "en". Must be one of the project's lock-declared
  // `languages` — enforced at CODEGEN, not by the parser, which
  // is handed descriptors and never sees the lock. (This said
  // "parser-enforced" while nothing enforced it anywhere: a
  // default with no catalogue behind it started, served, and
  // rendered every msgid's fallback.) When set, the gateway:
  //   - auto-installs `Accept-Language → w17-language` into
  //     metadata_propagation.header_renames (unless the author
  //     has already declared an explicit Accept-Language entry,
  //     in which case the author's wins),
  //   - stamps `w17-language: <default_language>` on every
  //     outgoing metadata BEFORE the header rule fires, so
  //     missing / empty Accept-Language falls back to this
  //     default rather than gettext's compile-time "en".
  //
  // Surfaces with different default_language values can coexist
  // in the same domain binary (e.g. `rest_public.proto` →
  // "cs", `rest_admin.proto` → "en") — the matched surface
  // dictates the default for each request.
  string default_language = 8;

  // Plugin REST presets opted into this surface. A plugin's
  // `presets.rest` bundle (its endpoint groups — paths, verbs,
  // exclude_auth) is OFF by default: activating a plugin never
  // auto-publishes routes onto your surface. List the plugin here to
  // opt in — the analogue of Django's `include("auth.urls")`. Each
  // entry names the plugin's ACTIVATION name in this domain (its
  // `registered_as`, e.g. "auth"); `mount` optionally relocates the
  // plugin's group prefixes (final = prefix + mount + group.prefix +
  // endpoint.path). Empty = no plugin routes (the default).
  //
  // Note: this controls only the plugin's PUBLISHED routes. The
  // plugin's `auth_methods` (the bearer/gating middleware) and
  // `forward_headers` are injected automatically whenever the plugin
  // is active — they restrict / plumb, they don't expose, so they are
  // not gated by an include. Individual plugin methods can instead be
  // wired by hand as ordinary `groups[].endpoints[]` (by ref) with no
  // include at all.
  //
  // Spec: docs/decisions/plugin-surfaces-opt-in.md.
  repeated PluginInclude include = 9;
}

// PluginInclude opts one plugin's REST preset into a surface. `plugin`
// is the plugin's activation name in this domain (`registered_as`);
// `mount` is an optional URL sub-path prepended to every included
// group prefix (empty = no remount). Spec:
// docs/decisions/plugin-surfaces-opt-in.md.
message PluginInclude {
  string plugin = 1;
  string mount = 2;
}

// AuthMethod (REV-146) — one entry of `RestApi.auth_methods[]`.
// Pairs a method ref with the credential token types the method
// claims to handle. Gateway dispatches per request by peeking
// the Authorization scheme + matching against declared token
// types.
message AuthMethod {
  // Reference to the gRPC method, "<module>.<Service>.<Method>".
  // Same resolution rules as `RestEndpoint.ref` — domain-scoped,
  // cross-domain refs are a parse-time error.
  string ref = 1;

  // Token types this method handles. Required (empty list is a
  // parse-time error — declaring an auth method without saying
  // what credentials it accepts is meaningless). Repeating ANY
  // alongside other types is allowed but redundant; the parser
  // emits a warning when ANY coexists with a scheme-specific
  // type on the same method.
  repeated TokenType token_types = 2;
}

// TokenType (REV-146) — discriminator for the credential-scheme
// router. Gateway classifies the request's Authorization header
// at request time and picks an auth method whose `token_types`
// covers the classified scheme.
//
// v1 set is deliberately small: BEARER + BASIC cover the two
// schemes already nailed down by HTTP RFC 7235; ANY is the
// escape hatch for everything else (X-API-Key headers, session
// cookies, custom proprietary schemes). COOKIE and API_KEY are
// parked — both need configurable name (which cookie? which
// header?) and the right shape for that deserves a separate
// decision pulled by a real fixture.
//
// URL_TOKEN un-parks exactly that shape for the URL carrier —
// the fixture arrived (a customer opens an invoice from a link
// in an e-mail, with no session and no way to set a header).
// It is NOT classified from the Authorization header like the
// others; it is selected by the endpoint's `credential`
// declaration. See TOKEN_TYPE_URL_TOKEN + `Credential` below.
enum TokenType {
  TOKEN_TYPE_UNSPECIFIED = 0;
  // BEARER — Authorization: Bearer <opaque-token>. The standard
  // JWT / opaque-token shape; gateway classifies any request
  // whose Authorization scheme is "Bearer" (case-insensitive)
  // as this type.
  TOKEN_TYPE_BEARER = 1;
  // BASIC — Authorization: Basic <base64(user:pass)>. The
  // standard HTTP Basic shape; gateway classifies any request
  // whose Authorization scheme is "Basic" (case-insensitive)
  // as this type.
  TOKEN_TYPE_BASIC = 2;
  // ANY — catch-all. Matches any request the scheme classifier
  // didn't pick a specific type for (custom Authorization
  // schemes, missing Authorization header but the method body
  // sniffs another carrier itself such as a cookie or
  // X-API-Key). Use sparingly — the type-routing optimisation
  // disappears for ANY-typed methods since they get invoked
  // for every non-scheme-specific request.
  TOKEN_TYPE_ANY = 3;
  // URL_TOKEN — the credential travels in the URL itself (a
  // path segment or a query parameter), declared per endpoint
  // via `RestEndpoint.credential`. For capability links: a
  // customer opens an invoice from an e-mail with no session,
  // a share link, a one-click unsubscribe.
  //
  // Unlike the other types this one is NOT reached by peeking
  // the Authorization header — a URL_TOKEN method is invoked
  // ONLY for endpoints that declare `credential`, never as a
  // fall-through for the rest of the surface. That is the whole
  // point of the per-endpoint declaration: without it a
  // URL-carried credential would have to be an ANY catch-all,
  // and appending `?token=<stolen>` to any other route on the
  // surface would authenticate the caller as that token's
  // principal.
  //
  // This is NOT `exclude_auth`. The endpoint stays fully
  // authenticated: the auth method resolves the token into the
  // same AuthResp everything else produces, so `scopes` still
  // isolate tenants, ACL still gates, and the request still
  // logs, traces and re-authenticates like any other. What the
  // handler then writes by hand is row SELECTION, not tenant
  // ISOLATION — and getting selection wrong leaks a sibling row
  // inside the same scope, never another tenant's.
  TOKEN_TYPE_URL_TOKEN = 4;
}

// Credential (REV-162) — declares that THIS endpoint carries its
// credential in the URL rather than in a header, and names where.
// Presence routes the endpoint's auth call to the surface's
// URL_TOKEN auth method; absence means the endpoint authenticates
// the ordinary way (Authorization header, scheme-classified).
//
//     { ref: "documents.DocumentQuery.GetPublicDocument",
//       method: GET, path: "/public/invoices/{token}",
//       credential: { path_param: "token" } }
//
// The gateway extracts the value and hands it to the auth method
// as a reserved entry in `AuthReq.headers` under the fixed key
// `x-w17-credential` — so the auth backend contract does not
// change at all, and a hand-written auth service sees it exactly
// like the auth plugin would. That key is stripped from every
// inbound request before the map is built, on every endpoint,
// declared or not: a client that could set the header itself
// would be forging the channel.
//
// `credential` and `exclude_auth` on one endpoint is a parse-time
// error. They are opposites — one says "this request has an
// identity, it just arrives elsewhere", the other says "this
// request has no identity at all".
//
// Not available on `RestStream` yet — see the note there.
message Credential {
  // Name of the `{placeholder}` in the endpoint's `path` that
  // holds the credential. Must match a placeholder actually
  // present in the template.
  //
  // Prefer this over `query_param` when you control the link
  // shape: query strings are the part of a URL most eagerly
  // recorded by proxies and analytics.
  string path_param = 1;

  // Name of the query parameter that holds the credential, for
  // link shapes that cannot put it in the path (`?t=…`).
  //
  // Exactly one of `path_param` / `query_param` must be set;
  // neither or both is a parse-time error.
  string query_param = 2;
}

// MetadataPropagation declares which HTTP request headers
// the gateway forwards as gRPC metadata to the backend
// handlers. Headers do not surface on any request message —
// storage handlers read them via `metadata.FromIncomingContext`
// or generated typed accessors.
//
// Forwarding rule: each listed header value lands as gRPC
// metadata under the LOWERCASED header name, verbatim.
// `X-Request-Id` → `x-request-id`; `traceparent` →
// `traceparent`. Multi-valued HTTP headers fan out as
// metadata's per-key list.
//
// No prefix is stripped. This doc claimed an `X-` strip
// (`X-Request-Id` → `request-id`) from REV-020 until 2026-07-30;
// the middleware has always done a plain `strings.ToLower`, and
// nothing noticed because no example declared the annotation, so
// the only readers were authors following a rule the runtime
// never implemented. The runtime's behaviour is the one kept: a
// strip is lossy (`X-User-Locale` and `User-Locale` collapse onto
// one key) and it duplicates `header_renames` below, which exists
// precisely to forward under a different name.
//
// Defaults (when this message is unset OR `headers` is empty):
//   X-Request-Id, traceparent, tracestate, baggage
//
// W3C trace-context (traceparent / tracestate) + correlation
// (X-Request-Id) + baggage (W3C baggage spec) form the
// distributed-tracing baseline every observability tool
// expects, so the default propagates them out-of-the-box.
message MetadataPropagation {
  // Explicit list of HTTP header names to forward. When set,
  // replaces the W3C default set (unless `extend_defaults`
  // is true). Header names are matched case-insensitively at
  // runtime.
  repeated string headers = 1;

  // When true, the W3C defaults stay in effect AND `headers`
  // is added on top. When false (default), `headers` (if
  // non-empty) replaces the defaults entirely.
  bool extend_defaults = 2;

  // REV-149 — propagate an HTTP header into a DIFFERENT-named
  // gRPC metadata key. The `headers[]` form above forwards a
  // header verbatim (lowercased, X- prefix stripped); this
  // form is for cases where the HTTP-side and gRPC-side names
  // diverge by convention.
  //
  // Typical use: i18n ships an auto-installed
  // `Accept-Language → w17-language` entry whenever a REST
  // surface declares `default_language`, so the FE talks
  // standard HTTP while the backend reads a w17-namespaced
  // metadata key. Authors can also declare custom mappings
  // (e.g. `X-User-Locale → w17-language`, `X-Tenant-ID →
  // w17-tenant`).
  //
  // Multiple HTTP headers mapping to the same metadata key:
  // last entry wins at runtime (the gateway processes
  // header_renames[] in declaration order, overwriting).
  // Auto-installed entries land BEFORE author entries so the
  // author wins by default.
  repeated HeaderRename header_renames = 3;
}

// HeaderRename (REV-149) — one HTTP→metadata renaming entry of
// `MetadataPropagation.header_renames[]`. Headers absent on the
// request produce no metadata entry (no empty-string stamping).
// Multi-valued HTTP headers fan out as the metadata key's per-
// value list (matching the verbatim-headers semantic).
message HeaderRename {
  // HTTP header name. Matched case-insensitively at runtime;
  // the canonical case as declared here is what surfaces in
  // OpenAPI / documentation. Required.
  string http = 1;

  // Target gRPC metadata key. Lowercase ASCII per gRPC
  // convention (mixed-case keys are silently lowercased by the
  // gRPC library, so the rename loses information when the key
  // varies in case). Required.
  string metadata = 2;
}

// RestGroup buckets endpoints + streams under a shared sub-
// prefix and surfaces as one OpenAPI tag. Mental model: one
// FastAPI APIRouter / Django app urls.py / Spring
// RouterFunction module.
message RestGroup {
  // URL sub-prefix prepended to every endpoint / stream path
  // in this group. Composes with `RestApi.prefix`:
  //
  //   final URL = <api.prefix> + <group.prefix> + <endpoint.path>
  //
  // Convention is to start with `/` (e.g. "/users", "/tasks");
  // empty is allowed when the group sits at the api root.
  string prefix = 1;

  // Group description — surfaces verbatim as the OpenAPI tag
  // description for every endpoint in this group. Empty = no
  // description (OpenAPI still emits the tag from the group's
  // prefix).
  string description = 2;

  // Unary endpoints — gRPC methods whose stream qualifier is
  // unary on both sides. Streaming methods placed here are a
  // parse-time error (use `streams:` instead).
  repeated RestEndpoint endpoints = 3;

  // Streaming endpoints — gRPC methods with at least one
  // streaming qualifier (server-stream / client-stream / bidi).
  // Unary methods placed here are a parse-time error.
  repeated RestStream streams = 4;

  // Download endpoints — read-only HTTP routes that stream
  // stored uploaded blobs (UPLOADED_FILE / UPLOADED_IMAGE
  // fields) directly from the gateway with full HTTP cache
  // semantics (Range / ETag / 304 / Cache-Control /
  // Content-Disposition). Replaces the need for nginx in
  // front of the service for static-asset serving.
  repeated DownloadEndpoint downloads = 5;

  // Explicit group identifier — the token the generated client
  // facade exposes (session.<name>.…) and the OpenAPI / AsyncAPI
  // tag use. Empty = derived from `prefix` (camelCase of the
  // prefix segments, e.g. "/task-docs" → "taskDocs"). Set this to
  // override the derived name (e.g. a prefix that slugs badly, or
  // two groups that should share one facade).
  string name = 6;
}

// RestEndpoint binds one unary gRPC method to an HTTP route.
//
// Default body shape: the WHOLE request message is the JSON
// body, MINUS every field bound elsewhere (path template,
// `fields[]`, `query_expand`). The body shortcut `body:
// "<fieldname>"` (REV-020) overrides this — the body becomes
// that one field's contents, unwrapped to top-level JSON.
// Path templates always auto-bind top-level fields whose name
// matches the `{token}`; explicit `fields[]` is the escape
// hatch for non-trivial routing (nested-message fields,
// renames, headers, query params under a different name).
message RestEndpoint {
  // Reference to the gRPC method, "<module>.<Service>.<Method>".
  // Module is the proto module (matching FK ref shape from
  // REV-015). Resolution is domain-scoped: a `rest.proto` in
  // `proto/domains/<domain>/` may only reference methods
  // declared under the same domain. Cross-domain refs are a
  // parse-time error — cross-domain orchestration belongs in
  // a business facade (which is itself addressed via a ref).
  string ref = 1;

  // HTTP verb. Required.
  HttpMethod method = 2;

  // URL template, group-relative. Supports `{name}` placeholders
  // resolved against top-level fields on the referenced
  // method's request message; e.g. `/{user_id}` matches
  // `GET <prefix>/<group>/42` and binds `user_id = 42`.
  // Required, must start with `/`.
  string path = 3;

  // Skip the auth middleware for this endpoint even when
  // `RestApi.auth_methods[]` is populated. Use for sign-in /
  // health / metrics endpoints. Default false.
  bool exclude_auth = 4;

  // (field number 5 retired — previously `repeated string
  // auth_scopes`. Replaced by the ACL cascade in REV-146;
  // permission checks emit automatically from the declared
  // ACL flags on the model + method, no per-endpoint scope
  // list to maintain.)
  reserved 5;
  reserved "auth_scopes";

  // Response-message field names (proto names — snake_case as
  // declared in the .proto) the gateway clears before
  // marshaling JSON. Hides internal-only fields from REST
  // clients while keeping them on the gRPC contract for admin
  // tools / internal services. Streaming endpoints (i.e.
  // `RestStream`, not this message) don't honor this field.
  repeated string response_omit_fields = 8;

  // REV-020 — explicit field-to-HTTP-slot routing. Each
  // entry pulls a request-msg field from a non-body source
  // (path / query / header). Fields not listed here keep
  // their default behavior: top-level fields whose name
  // matches a path template token bind from the path; other
  // top-level scalars decode from the query string; the
  // remainder lands in the JSON body.
  //
  // The `fields[]` list is the escape hatch for non-trivial
  // cases — nested message fields routed to query, headers
  // delivering business-relevant values (idempotency keys,
  // optimistic-concurrency etags), explicit renames where
  // the URL key differs from the proto field name.
  repeated FieldBinding fields = 9;

  // REV-020 — body shape:
  //
  //   ""            (default) the JSON body is the whole
  //                 request msg, minus every field bound
  //                 elsewhere via path template / `fields[]`
  //                 / `query_expand`. OpenAPI emits the
  //                 reduced schema; generated body decoder
  //                 only populates the residual fields.
  //
  //   "*"           explicit synonym of "" (whole-msg minus
  //                 routed-out fields).
  //
  //   "<fieldname>" the body IS the contents of `<fieldname>`,
  //                 unwrapped to top-level JSON. The field
  //                 must exist on the request msg and be a
  //                 message-typed or repeated field (scalars
  //                 as bare-JSON bodies are bizarre and
  //                 rejected at parse time). Other fields
  //                 must all be routed via path / query /
  //                 header (otherwise they have nowhere to
  //                 land).
  string body = 10;

  // REV-020 — submessage-to-query expansion shortcut. Each
  // entry names a request-msg field; every leaf scalar
  // reachable below that field becomes a query parameter at
  // its leaf-segment name. Use for paginated lists where the
  // request msg groups filter / paging fields into nested
  // messages but the URL still wants them flat (`?status=...&
  // page=2&limit=20`). Composes with `fields[]` for selective
  // overrides / renames.
  //
  // Listed submessages are excluded from the body.
  repeated string query_expand = 11;

  // Slice B of the upload feature — flips the gateway
  // handler into multipart/form-data mode. When true, the
  // generated handler:
  //
  //   - Parses the request as `multipart/form-data` instead
  //     of JSON.
  //   - Streams every FILE_PART-bound part to a tmp file
  //     under the configured connection's bucket root,
  //     hashing during write.
  //   - On successful read of all parts, atomically moves
  //     the tmp file to its final hash-derived sub-bucket
  //     path and populates the request msg's
  //     UPLOADED_FILE / UPLOADED_IMAGE field with the
  //     resolved storage handle.
  //   - JSON-bearing parts (named via `body: "<field>"`)
  //     decode as JSON into the matching submessage; other
  //     bindings (HEADER, PATH_VAR, QUERY_PARAM) keep their
  //     existing behaviour.
  //
  // Required when any FILE_PART binding is present;
  // forbidden otherwise (multipart=true with no FILE_PART
  // is a meaningless toggle, parser rejects).
  bool multipart = 12;

  // REV-148 — cursor-style pagination opt-in. When set with
  // `enabled = true`, the generated REST handler encodes the
  // original request into a base64-url-safe cursor and
  // returns a `w17.Paging` envelope (which the response
  // message must declare explicitly — codegen errors if
  // missing). Storage layer stays paging-agnostic; the
  // keyset WHERE clause + ORDER BY boundaries are derived
  // by the codegen from the storage method's DQL ORDER BY.
  //
  // Spec: docs/specs/gateway/cursor-paging.md
  PagedConfig paged = 13;

  // REV-149 — route an HTTP slot (path token / query param /
  // header) into a gRPC metadata key instead of into a
  // request-msg field. The sibling of `fields[]` (which
  // routes into a msg field): same source enumeration
  // (PATH_VAR / QUERY_PARAM / HEADER; FILE_PART is rejected
  // — bytes don't fit in metadata), different target.
  //
  // Typical use:
  //   - URL-driven locale: `/api/{lang}/...` →
  //     w17-language metadata (overrides Accept-Language).
  //   - Idempotency keys: `Idempotency-Key` header →
  //     idempotency-key metadata where the storage tier reads
  //     it for upsert dedup.
  //   - Tenant override: `?tenant=X` query → w17-tenant
  //     metadata where REV-147 scopes auto-stamp it onto
  //     mutations.
  //
  // The msg-field routing (`fields[]`) and the metadata
  // routing here are orthogonal — same field never appears in
  // both because the value lands in a different place. Empty
  // metadata key is a parse-time error.
  repeated MetadataBinding metadata_bindings = 14;

  // raw_body_field — name (proto snake_case) of a `bytes` field on
  // the request message that receives the VERBATIM HTTP request body,
  // with NO JSON→proto transcode. The exact wire bytes land in the
  // field unchanged, which is what byte-identical signature checks
  // (e.g. GitHub's X-Hub-Signature-256 HMAC) require — a re-marshaled
  // body would not match the upstream's MAC.
  //
  // Mutually exclusive with `body` (field 10): a raw-body endpoint
  // consumes the whole request body into this one field, so it can't
  // also map the body onto a sub-message. Other request fields still
  // bind from path / query / header via `fields[]` (FieldBinding) and
  // from headers via `metadata_bindings[]` as usual. Empty = normal
  // JSON body handling.
  //
  // Parse-time checks: the named field must exist on the request
  // message and be of `bytes` type; `body` must be unset.
  string raw_body_field = 15;

  // Explicit operation name — the human-readable operation the
  // generated client facade exposes (session.<group>.<operation_id>)
  // and the OpenAPI operationId derive from. Empty = derived from
  // the method name (lowerCamel, group-noun-stripped in the facade).
  // Set this to resolve a within-group naming collision, or to give
  // an operation a friendlier name than its gRPC method.
  string operation_id = 16;

  // REV-162 — this endpoint's credential travels in the URL, not
  // in a header. Routes the auth call to the surface's URL_TOKEN
  // auth method and names the path/query slot the token sits in.
  // Unset (the default) = ordinary header authentication.
  //
  // Mutually exclusive with `exclude_auth`. See `Credential`.
  //
  // (Field numbers 6 and 7 are free but deliberately unused —
  // they have never appeared in any released shape and their
  // absence is unexplained, so new fields take fresh numbers
  // rather than gamble on wire history.)
  Credential credential = 17;
}

// MetadataBinding (REV-149) — one HTTP-slot → gRPC-metadata
// routing entry. Sibling of `FieldBinding` (REV-020) which
// targets a request-msg field; this one targets a metadata key.
// Field-binding semantic for source resolution (PATH_VAR /
// QUERY_PARAM / HEADER) is shared verbatim; FILE_PART is
// rejected at parse time (multipart bytes don't fit in metadata).
message MetadataBinding {
  // HTTP-side identifier — path template token, query parameter
  // key, or header name. Empty defaults to the value of
  // `metadata` (use the same name on both sides). Path bindings
  // additionally require the URL template to declare a matching
  // `{token}`. Header names are matched case-insensitively at
  // runtime.
  string ref = 1;

  // Where the value is sourced from. PATH_VAR / QUERY_PARAM /
  // HEADER are valid; FIELD_SOURCE_UNSPECIFIED and FILE_PART
  // are parse-time errors.
  FieldSource from = 2;

  // Target gRPC metadata key. Lowercase ASCII per gRPC
  // convention. Required (empty = parse error).
  string metadata = 3;
}

// PagedConfig configures cursor-based pagination on one
// REST endpoint (REV-148). Every field has a sensible
// default; the boolean sugar form `paged: true` in the
// registry decompiles to `PagedConfig{ enabled: true }`
// with defaults applied.
message PagedConfig {
  // Master switch. When false (or PagedConfig left zero-
  // valued), the endpoint behaves identically to a non-
  // paged REST endpoint.
  bool enabled = 1;

  // Query parameter name carrying the opaque cursor token.
  // Default "cursor". Configurable per-endpoint so an API
  // with its own established convention (e.g. "after",
  // "page_token") can match it.
  string cursor_param = 2;

  // Query parameter name carrying the requested page size.
  // Default "limit". Configurable per-endpoint for the same
  // reason as cursor_param.
  string limit_param = 3;

  // Page size used when the request omits the limit query
  // parameter (and the first page is being fetched).
  // Default 20.
  uint32 default_limit = 4;

  // Hard cap on page size. Requested limits above this are
  // silently clamped to this value before the storage call.
  // Default 100.
  uint32 max_limit = 5;
}

// FieldBinding routes one request-msg field to a non-body
// HTTP slot (REV-020). Fields not in any binding keep default
// behavior — body-bound for non-GET/DELETE verbs, ignored for
// GET/DELETE.
message FieldBinding {
  // Dotted path on the request message naming the field to
  // route. Single segment (`status`) for a top-level field;
  // dotted (`filters.status`, `paging.limit`) for nested
  // message fields. Must resolve to a real field at parse
  // time; the leaf segment must be a scalar (path / query /
  // header all carry string-shaped values; nested messages
  // can't bind directly).
  string ref = 1;

  // Where the value is sourced from on the HTTP side.
  FieldSource from = 2;

  // HTTP-side identifier — path template token, query
  // parameter key, or header name. Empty defaults to the
  // leaf segment of `ref`. Path bindings additionally
  // require the URL template to declare a matching `{token}`.
  // Header names are matched case-insensitively at runtime.
  string http_name = 3;
}

// FieldSource picks which HTTP slot the FieldBinding pulls
// from. Auth-context magic ("/users/me/...") deliberately
// isn't here — auth-bound endpoints look like every other
// auth-required endpoint, with the user_id arriving via gRPC
// metadata (REV-017's auth middleware).
enum FieldSource {
  FIELD_SOURCE_UNSPECIFIED = 0;
  PATH_VAR    = 1;
  QUERY_PARAM = 2;
  HEADER      = 3;
  // FILE_PART — Slice B of the upload feature. The binding
  // pulls bytes from a `multipart/form-data` part of the
  // configured name and routes them through the gateway's
  // streaming upload handler. Target field MUST be typed
  // UPLOADED_FILE / UPLOADED_IMAGE (parser rejects other
  // types). Endpoint MUST set `multipart: true` (parser
  // rejects FILE_PART on non-multipart endpoints).
  // `http_name` defaults to the leaf segment of `ref` —
  // the form-part name the gateway looks for.
  FILE_PART   = 4;
}

// RestStream binds one streaming gRPC method to an HTTP
// streaming route. Transport (SSE vs WS) auto-derives from the
// gRPC streaming kind; `transport_override` flips when the
// default doesn't match the consumer.
message RestStream {
  // Reference, same shape as RestEndpoint.ref.
  string ref = 1;

  // URL template, group-relative. Path-template binding
  // semantics match RestEndpoint.path.
  string path = 2;

  // Auto-derivation table:
  //   gRPC server-stream  → SSE (text/event-stream, GET-shaped)
  //   gRPC client-stream  → WS  (browsers can't natively
  //                              upload-stream over HTTP)
  //   gRPC bidi-stream    → WS
  //
  // Override only when the consumer needs the non-default — e.g.
  // a server-stream RPC where the browser also needs to send
  // "abort" frames (force WS) or a client/bidi RPC where the
  // server only ever sends one message (force… well, today
  // there's no SSE-with-uplink option, so this is mostly a
  // forward-compat slot for future transports).
  //
  // Forcing SSE on a non-server-stream method is a parse-time
  // error — SSE has no client-uplink primitive in the spec.
  StreamTransport transport_override = 3;

  // Skip the auth middleware for this stream even when
  // `RestApi.auth_methods[]` is populated. Same semantic as
  // RestEndpoint.exclude_auth.
  bool exclude_auth = 4;

  // (field number 5 retired — see RestEndpoint.auth_scopes
  // note for the REV-146 rationale.)
  reserved 5;
  reserved "auth_scopes";

  // REV-149 — route a path token / query param / header into a gRPC
  // metadata key for THIS stream. Same shape and semantics as
  // RestEndpoint.metadata_bindings.
  //
  // Field 6 previously held `required_headers`, a REV-017 leftover.
  // REV-020 replaced that mechanism on RestEndpoint with `fields[]` +
  // api-level `metadata_propagation` and deleted it there — but not
  // here, so it sat on this message reading nothing for months: the
  // parser never touched it, no emitter consumed it, and its doc
  // deferred to a sibling that no longer existed. Streams were left
  // with surface-wide propagation and no per-stream control at all.
  //
  // The handler prologue that applies these has always been SHARED
  // across unary and streaming bodies; only the parser branch was
  // thinner. So this is the mechanism the removed field pretended to
  // be, wired to the emitter that was already waiting for it.
  repeated MetadataBinding metadata_bindings = 6;

  // Explicit operation name — same semantic as
  // RestEndpoint.operation_id, for streaming operations.
  string operation_id = 7;

  // REV-020 — explicit field-to-HTTP-slot routing, same shape and
  // semantics as RestEndpoint.fields. A stream's request message is
  // sent once at connect, so binding a header / query param into it is
  // the same operation it is for a unary call. Path-template tokens
  // already auto-promote to implicit PATH_VAR bindings.
  repeated FieldBinding fields = 8;

  // REV-163 — this stream's credential travels in the URL. Same
  // shape and same meaning as RestEndpoint.credential: the stream
  // stays fully authenticated, its credential simply arrives
  // somewhere a browser opening an EventSource can put it.
  //
  // It landed one revision AFTER the unary form, and the gap was
  // not the shape — that was identical and the extraction helper
  // is shared. It was the RUNTIME POLICY a long-lived connection
  // needs, because a stream authenticates ONCE at upgrade and
  // then never again.
  //
  // For a session client that barely shows: the client reconnects
  // on token refresh / reload / network blip, so a revoked
  // credential stops working within minutes. A capability link
  // has no session lifecycle at all, so nothing ever forces a
  // reconnect and a revoked token would keep streaming for as
  // long as the TCP connection survives. The hole was never
  // URL_TOKEN's — a Bearer-authenticated stream had it too — but
  // a capability link turns "in practice it closes itself" into
  // "it does not". So REV-163 ships periodic re-auth for EVERY
  // authenticated stream and this field on top of it; see
  // docs/specs/gateway/url-credentials.md.
  //
  // The `?ticket=` flow (ws_auth.go) is a different tool and not
  // a substitute: a ticket is a SWAP for an existing credential —
  // you must already be authenticated to mint one — and its
  // safety comes from being one-shot with a 30s TTL, which is
  // exactly what a customer link cannot be.
  Credential credential = 9;
}

// DownloadEndpoint binds a static download route under the
// REST surface to a set of UPLOADED_* fields declared on
// request / response messages elsewhere in the registry.
//
// At runtime the gateway streams the stored blob directly
// from its kvfs.Driver — no proxy hop, no nginx in front.
//
//   final URL = <api.prefix> + <group.prefix> + <download.path>
//                 + <field.bucket_path> + <sub_bucket> + <object_key>
//
// `<field.bucket_path>` is the Slice A `(w17.field).upload.bucket_path`
// declared on the resolved UPLOADED_* field; `<sub_bucket>` and
// `<object_key>` are the same shape the upload handler stored.
message DownloadEndpoint {
  // URL prefix under which the resolved fields' blobs serve.
  // Composes with the api + group prefixes. Required, must
  // start with `/`, no trailing slash, no `{token}` placeholders.
  string path = 1;

  // Field selector — Django-style include/exclude over
  // fully-qualified UPLOADED_* field refs.
  //
  // Glob syntax (single-segment wildcard, no `**`):
  //   "*"                       — every UPLOADED_* field in the surface
  //   "<module>.*"              — every UPLOADED_* field in <module>
  //   "<module>.<Msg>.*"        — every UPLOADED_* field on <Msg>
  //   "<module>.<Msg>.<field>"  — exact field
  //
  // `<module>` is the last segment of the proto package
  // (matches REST endpoint ref shape). Globs resolve at parse
  // time to a concrete set of fields. `exclude` subtracts from
  // `include`. Empty `include` is a parse error (an endpoint
  // serving zero fields is a footgun, not a valid config).
  // Globs that resolve to zero fields are also a parse error
  // (typo guard).
  repeated string include = 2;
  repeated string exclude = 3;

  // Skip the auth middleware for this download even when the
  // surface declares `auth_methods[]`. Same semantic as
  // RestEndpoint.exclude_auth.
  bool exclude_auth = 4;

  // (field number 5 retired — see RestEndpoint.auth_scopes
  // note for the REV-146 rationale.)
  reserved 5;
  reserved "auth_scopes";

  // Verbatim Cache-Control header value. Empty = no header
  // emitted (browser falls back to heuristic caching). Common
  // picks: "public, max-age=31536000, immutable" for content-
  // addressed (sha256-keyed) objects since the URL changes
  // when content changes; "no-store" for sensitive blobs.
  string cache_control = 6;

  // Content-Disposition picker. INLINE (default) renders the
  // body in-browser; ATTACHMENT triggers a save-as dialog with
  // the object_key as filename. Per-endpoint, not per-field —
  // split into multiple endpoints if you need both.
  ContentDisposition content_disposition = 7;

  // ETag emission toggle. Default is enabled (the object_key
  // IS the sha256 hex of content, so the strong ETag is free).
  // Disable only when the storage backend rewrites bytes under
  // a stable key (none of today's drivers do).
  bool disable_etag = 8;

  // Range-request toggle. Default is enabled (i.e. honour
  // `Range: bytes=…`). Disable for endpoints whose backend
  // can't serve partial reads efficiently — none today.
  bool disable_range = 9;

  // Required: how URLs to objects under this download prefix
  // are rendered when a REST endpoint returns one of the
  // resolved UPLOADED_* fields in its response. The parser
  // refuses URL_FORM_UNSPECIFIED so the choice is always
  // explicit at declaration time.
  //
  //   RELATIVE — `<prefix>/<bucket>/<key>` only; the FE
  //              composes the absolute URL itself (typical
  //              when FE + BE share the same host).
  //   ABSOLUTE — `<scheme>://<host><prefix>/<bucket>/<key>`;
  //              the gateway prepends a host read from
  //              `<ENV_PREFIX>_PUBLIC_HOST` at boot. Picks
  //              this when FE runs on a different domain
  //              (CORS deploys, mobile clients, CDN-fronted).
  URLForm url_form = 10;
}

// URLForm picks how the gateway renders URLs for UPLOADED_*
// response fields covered by this DownloadEndpoint. Required
// on every DownloadEndpoint — the parser refuses UNSPECIFIED
// so authors don't accidentally ship the wrong shape.
enum URLForm {
  URL_FORM_UNSPECIFIED = 0;  // parse error
  URL_FORM_RELATIVE    = 1;
  URL_FORM_ABSOLUTE    = 2;
}

// ContentDisposition picks the value of the
// Content-Disposition response header on download endpoints.
enum ContentDisposition {
  CONTENT_DISPOSITION_UNSPECIFIED = 0; // → INLINE
  CONTENT_DISPOSITION_INLINE      = 1;
  CONTENT_DISPOSITION_ATTACHMENT  = 2;
}

// HttpMethod enumerates the HTTP verbs the gateway emits.
// Adding a verb here must extend the gateway generator's
// route emit; today the five most common are wired. PATCH-as-
// merge / PATCH-as-jsonpatch semantics are the caller's
// responsibility.
enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  GET    = 1;
  POST   = 2;
  PUT    = 3;
  DELETE = 4;
  PATCH  = 5;
}

// StreamTransport selects the HTTP-side streaming shape for a
// streaming gRPC method. UNSPECIFIED triggers auto-derivation
// from the gRPC streaming kind; the other two are explicit
// picks.
enum StreamTransport {
  STREAM_TRANSPORT_UNSPECIFIED = 0;
  STREAM_TRANSPORT_SSE = 1;
  STREAM_TRANSPORT_WS  = 2;
}
