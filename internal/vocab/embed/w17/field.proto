syntax = "proto3";

package w17;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/wandering-compiler/sdk/go/pb/w17;w17pb";

// Field declares the DB / data semantics of a proto field. Previously split
// across (w17.field) + (w17.validate) — merged 2026-04-20 (the split was
// artificial: max_len appeared on both, CHECK-vs-app enforcement is a target
// concern, not a source concern). See docs/archive/iteration-1.md D7 and
// docs/iteration-1-m1-rev.md.
//
// Usage:
//   string slug = 2 [(w17.field) = { type: SLUG, max_len: 120, unique: true }];
//   double price = 5 [(w17.field) = { type: MONEY, gte: 0 }];
//   google.protobuf.Timestamp created_at = 10
//     [(w17.field) = { type: DATETIME, default_auto: NOW }];
extend google.protobuf.FieldOptions {
  Field field = 51001;
}

// (w17.validate) — message-level cross-field validation rules
// (G3-V-01). Companion to (w17.field): single-field constraints
// (max_len, gte, regex, …) belong on the field; rules that span
// MULTIPLE fields (`required_if`, `at_most_one`, `less_than`,
// `not_contains`, …) belong here.
//
// Usage:
//
//   message ChangePasswordReq {
//     string old_password = 1;
//     string new_password = 2 [(w17.field) = { min_len: 8 }];
//     string email        = 3 [(w17.field) = { type: EMAIL }];
//
//     option (w17.validate) = {
//       rules: [
//         { kind: REQUIRED_IF,  field: "new_password", when_field: "old_password" },
//         { kind: NOT_CONTAINS, field: "new_password", against_fields: ["email"] },
//       ]
//     };
//   }
//
// Field references use dotted notation for nested messages —
// `user.email` resolves through `req.GetUser().GetEmail()`. The
// validation walker resolves paths via proto reflection at
// codegen time + emits the matching Go accessor chain.
extend google.protobuf.MessageOptions {
  Validate validate = 51002;
}

// Validate is the carrier for cross-field rules on a message.
// Empty rules list = no-op (the annotation can sit on a
// message that doesn't need rules without harm).
message Validate {
  repeated ValidationRule rules = 1;
}

// ValidationRule is one cross-field check. The `kind` field
// dispatches; per-kind shape fields are populated as
// appropriate. The validation walker rejects rules whose shape
// doesn't match the kind at codegen time: a missing per-kind
// field (AT_MOST_ONE without `fields`, MATCHES without
// `pattern`), a path that doesn't resolve on the request, a
// count rule naming fewer than two DISTINCT fields, or a side
// whose Go kind can't carry the comparison (LESS_THAN on
// non-numerics, NOT_CONTAINS / MATCHES on non-strings).
message ValidationRule {
  ValidationRuleKind kind = 1;

  // Single-field rules (REQUIRED_IF, REQUIRED_UNLESS,
  // NOT_CONTAINS, MATCHES) name the field under examination.
  // Dotted notation supported for nested messages.
  string field = 2;

  // REQUIRED_IF / REQUIRED_UNLESS dependency field.
  // when_field set + present → `field` becomes required.
  // unless_field set + present → `field` requirement is lifted.
  string when_field   = 3;
  string unless_field = 4;

  // Multi-field rules (AT_MOST_ONE, EXACTLY_ONE) name the set.
  // Dotted notation supported per entry.
  repeated string fields = 5;

  // LESS_THAN ordering pair. lhs < rhs at runtime.
  // Both accept dotted notation.
  string lhs = 6;
  string rhs = 7;

  // NOT_CONTAINS sibling-value substrings. `field`'s value
  // (string) must not contain any of `against_fields`'s values
  // (also string) as a substring. Use case: password must
  // not contain email / display_name / age.
  repeated string against_fields = 8;

  // MATCHES regex pattern. `field` must match (Go regexp
  // syntax — RE2). Distinct from (w17.field).pattern in that
  // this rule emits a custom validation message and runs at
  // the cross-field collector level (per-frame for streaming),
  // letting the author group regex checks logically with
  // their related cross-field rules.
  string pattern = 9;

  // Override message — emitted verbatim into the FieldError's
  // Message slot. Empty → auto-generated default tailored to
  // the rule kind ("X is required when Y is set", etc.).
  // Required for non-obvious compound rules where the auto-
  // default doesn't capture intent (e.g. a regex that encodes
  // a domain-specific constraint).
  string message = 10;
}

// ValidationRuleKind enumerates the supported cross-field
// rule shapes. Forward-compat: new kinds append; existing
// numeric values are stable.
enum ValidationRuleKind {
  VALIDATION_RULE_KIND_UNSPECIFIED = 0;

  // `field` required when `when_field` is set (non-zero).
  // Auto-default: "X is required when Y is set".
  REQUIRED_IF = 1;

  // `field` required when `unless_field` is NOT set (zero).
  // Auto-default: "X is required unless Y is set".
  REQUIRED_UNLESS = 2;

  // At most one of `fields` may be set. Allows zero set.
  // Auto-default: "at most one of [X, Y, Z] may be set".
  AT_MOST_ONE = 3;

  // Exactly one of `fields` must be set. Zero set fails;
  // ≥ 2 set fails.
  // Auto-default: "exactly one of [X, Y, Z] must be set".
  EXACTLY_ONE = 4;

  // `lhs` < `rhs` at runtime. Both must be numeric.
  // Auto-default: "X must be less than Y".
  LESS_THAN = 5;

  // `field`'s value (string) must not contain any of
  // `against_fields`'s values (string) as substring. Skipped
  // when either side is empty (matches the "blank → no
  // constraint" semantic of the per-field path).
  // Auto-default: "X must not contain Y".
  NOT_CONTAINS = 6;

  // `field` matches `pattern` (Go regexp / RE2 syntax).
  // Auto-default: "X format is invalid".
  MATCHES = 7;
}

message Field {
  // Semantic subtype. OPTIONAL everywhere — unset is `AUTO`, which
  // infers the subtype from the proto carrier (see Type.AUTO below for
  // the full mapping; REV-014). Set it when the inferred default isn't
  // the one you want (a `string` infers TEXT, so CHAR / SLUG / UUID /
  // EMAIL / … are opt-in).
  //
  // Where an explicit value IS constrained:
  //   bool    — must NOT set a type (one column shape, nothing to refine)
  //   bytes   — only JSON, or nothing
  //   Timestamp — DATE / TIME / DATETIME (infers DATETIME)
  //   Duration  — INTERVAL only (infers INTERVAL)
  //   map / repeated / message — AUTO only
  // The full carrier × type matrix is enforced at IR build time.
  Type type = 1;

  // Primary key.
  //
  // The row's identity, and the column an UPDATE's `WHERE` addresses
  // it by — so the whole-message shortcut (`SET :doc`, which names no
  // column) does NOT expand to it on either UPDATE-side SET: it would
  // re-key the row from the payload while the WHERE targeted it by a
  // different parameter. Dropped with a warning, same as `immutable`
  // below. The INSERT side keeps writing it — that is where a key is
  // supplied.
  //
  // Unlike `immutable`, naming the column explicitly is still allowed:
  // `UPDATE … SET id = :new_id` re-keys the row, which is a legitimate
  // thing to ask for and is visible in the DQL when you ask for it.
  // The drop covers only the shortcut, where nothing in the statement
  // shows the write.
  bool pk = 2;

  // Write-once: the column may be assigned at INSERT time (including
  // an UPSERT's insert side) and never afterwards. Enforced by the
  // COMPILER, at typecheck: naming the column in `UPDATE … SET` or in
  // `UPSERT … DO UPDATE SET` is a compile error. The whole-message
  // shortcut (`SET :doc`) names no column, so there the expansion
  // drops it with a warning and the stored value survives the UPDATE.
  //
  // No DDL carries the rule — no CHECK, no trigger, no column-level
  // grant is emitted, which is what "not enforced in SQL" meant here
  // before. Anything that bypasses generated DQL (a raw-SQL escape
  // hatch, psql, a data migration) can still write the column.
  //
  // Typical use: `created_at`, an external system's id, an audit
  // trail's payload.
  bool immutable = 4;

  // Opt-out of NOT NULL. When true the column is nullable AND the generated
  // internal proto emits the field as proto3 `optional`.
  bool null = 5;

  // String-only. When true allows empty string (default CHECK col <> '').
  // Orthogonal to null.
  bool blank = 6;

  // Data-level uniqueness. Renders as UNIQUE INDEX in SQL. Orthogonal to the
  // storage-level (w17.db.column).index flag (which is a pure optimisation).
  bool unique = 7;

  // --- Length bounds (string carriers) ---
  // max_len is required for CHAR and SLUG and drives VARCHAR(N) sizing. For
  // other string types it is an optional upper bound. Counted as Unicode
  // code points (char_length).
  int32 max_len = 8;
  optional int32 min_len = 9;

  // --- Numeric bounds ---
  // gt / lt strict, gte / lte inclusive. Can coexist (e.g. gte + lt).
  // `optional` so 0 vs unset is distinguishable.
  optional double gt  = 10;
  optional double gte = 11;
  optional double lt  = 12;
  optional double lte = 13;

  // --- Pattern override (string carriers) ---
  // Replaces the default regex implied by `type` (e.g. SLUG's `^[a-z0-9-]+$`).
  // Empty string = no override.
  string pattern = 14;

  // --- Enumerated choices (string carriers) ---
  // FQN of a proto enum reachable from this file. The IR builder resolves
  // the path, reads the enum's value names, and emits
  // CHECK (col IN ('VAL1', 'VAL2', …)). Cross-file enum references are
  // permitted — any enum the loader can see is fair game. Empty string =
  // no restriction.
  string choices = 16;

  // --- DECIMAL precision / scale (type: DECIMAL only) ---
  // precision = total number of significant digits (required for DECIMAL).
  // scale     = digits after the decimal point (default 0 — integer-like).
  // IR builder requires 0 <= scale <= precision for DECIMAL (scale 0 is
  // the integer-like default, not an error), and rejects both fields for
  // non-DECIMAL types.
  //
  // ENFORCEMENT (T2-6 pass #8, B-F5): the REQUEST side. The generated
  // validation block refuses any value the column could not store exactly
  // (VALIDATION_DECIMAL_PRECISION → `DECIMAL_PRECISION_VIOLATION`), where
  // "exactly" is value-preservation, not digit-counting: `19.900` fits
  // scale 2, `19.905` does not. Non-canonical decimal text (exponent form,
  // `NaN`, thousands separators) is refused for the same reason — a DECIMAL
  // rides the wire as a string precisely because it must be lossless.
  //
  // There is deliberately NO DDL CHECK for the scale half, and adding one
  // would be theatre: PostgreSQL coerces a value to the column type BEFORE
  // evaluating constraints, so `'19.905'` is already `19.91` by the time a
  // `CHECK (scale(col) <= 2)` runs. Only the integer-digit half raises at
  // the engine (PG 22003), and that error carries no field attribution.
  //
  // Declare it on the MODEL field. A mutation request that writes the
  // column does NOT restate it — the storage codegen reads the declaration
  // off the column each request field is written into, which is the whole
  // reason this is the one rule that travels that way: every OTHER rule a
  // model declares reaches the value through the column's own DDL CHECK,
  // and this one has no CHECK to reach it through.
  int32          precision = 17;
  optional int32 scale     = 18;

  // --- Default value at insert time ---
  // Exactly one of the branches may be set. No default_bool: bool defaults
  // go via AutoDefault.TRUE / FALSE for single-channel consistency.
  oneof default {
    string      default_string = 20;
    int64       default_int    = 21;
    double      default_double = 22;
    AutoDefault default_auto   = 23;
  }

  // Allowed file extensions for FILE_PATH / IMAGE_PATH (D22d).
  // Case-insensitive, no leading dot ("jpg", not ".jpg"). Use ["*"] to
  // disable the format CHECK (author documents "this is a path but any
  // suffix is fine"). Ignored for non-path types. Default when unset
  // on IMAGE_PATH = ["jpg","jpeg","png","gif","webp","avif","svg"];
  // FILE_PATH with no extensions is an IR-time error.
  repeated string extensions = 19;

  // Author-supplied size hint, in bytes, that the cost-based optimizer
  // (iter-2 §B1) reads when deciding JOIN-vs-prefetch for relations
  // that include this column. The hint matters for variable-size
  // carriers (text / json / bytes); fixed-size carriers (bool, int,
  // double, fixed-precision DECIMAL with precision) compute their
  // size from the type, so the hint is a no-op there.
  //
  // Unset (0) on a variable-size column = "no information" → the
  // optimizer applies its conservative default (4096 in iter-2 MVP).
  // Set this only when you know the typical row's payload differs
  // materially from 4096 — e.g. `body_text` averaging 8 KiB or
  // `kb_article_md` averaging 200 KiB. The number is the *average*
  // size; outliers don't shift the decision because the optimizer
  // sums over rows × Σ(field_avg) regardless.
  uint32 estimated_avg_bytes = 24;

  // custom_validator (G3-V-03) — escape hatch for validation
  // rules the annotation surface can't express. Names a Go
  // function the codegen calls before any other rule on the
  // field; a non-nil returned error short-circuits the
  // validation block with `codes.InvalidArgument`.
  //
  // Format: `<go-import-path>:<FuncName>`. The colon
  // separates the package import path from the symbol so
  // both can be looked up independently — codegen adds the
  // package to the bundle's import set + emits the call as
  // `<alias>.<FuncName>(req.Get<Field>())`. Alias is
  // derived from the import path's last segment (`example.
  // com/app/validators` → `validators`).
  //
  // Function signature must be `func(value <go-type>) error`
  // matching the field's Go type. The codegen doesn't
  // reflect the function — it splices the call verbatim and
  // trusts the author's signature; a mismatch surfaces as a
  // build-time error in the generated bundle, which keeps
  // the codegen surface narrow.
  //
  // Composes with the rest of (w17.field): the custom
  // validator runs FIRST. If the author wires both
  // `min_len: 8` and a `custom_validator` for the same
  // field, the custom check fires before the length check.
  // Authors typically use one OR the other; combining is
  // legal but unusual.
  string custom_validator = 25;

  // rest_alias renames this field on the REST surface only
  // (G3i3-Misc-A). The proto / gRPC wire keeps the original
  // field name for compat; the gateway swaps it to the alias
  // before writing JSON responses and accepts both names on
  // request decode (so existing consumers don't break when
  // the alias lands).
  //
  // Use case: an existing gRPC consumer locked the proto
  // field name (e.g. `user_id`) but external REST consumers
  // want the conventional shorter form (`id`). Renaming the
  // proto field would break wire compat; aliasing gives REST
  // its own name without touching the gRPC contract.
  //
  // Empty / unset = no alias (proto name is used). The alias
  // applies wherever the message lands on a REST output —
  // declared once on the field, applied across every gateway
  // emit that touches the parent message.
  //
  // Today's runtime: the gateway's response writer post-
  // processes the protojson output via descriptor walk + key
  // rename. Cost is one extra parse/marshal per response on
  // messages whose type tree carries any alias; messages
  // without aliases skip the transform entirely.
  string rest_alias = 26;

  // related_name renames the reverse DQL accessor on the FK
  // target model (REV-016, Django-inspired). Only meaningful on
  // a field whose `(w17.db.column).fk` references another
  // model — on any other field the value is ignored.
  //
  // Default (when empty): `<lowercase_owning_model>_set` — the
  // proto message name carrying this field, lower-cased, with
  // `_set` suffix. Matches Django's reverse-accessor convention.
  //
  // Example:
  //
  //   message Comment {
  //     int64 user_id = 5 [
  //       (w17.field)     = { related_name: "comments" },
  //       (w17.db.column) = { fk: "users.User" }
  //     ];
  //   }
  //
  //   // DQL on the User side:
  //   //   User u JOIN u.comments c WHERE c.body LIKE ...
  //   //
  //   // Without `related_name`, the accessor would be `comment_set`.
  //
  // DQL-only — does NOT generate a Go navigation collection on
  // the target struct. The compiler resolves the accessor at
  // DQL-parse time to a JOIN; nothing is materialised in the
  // generated storage layer. Use this when (a) the default
  // `<lowercase>_set` collides because two FKs from the same
  // source target the same model, or (b) the default reads
  // poorly in DQL and an explicit name is clearer
  // (`parent_id → related_name: "children"`).
  //
  // Collisions: when multiple FKs from the same source point at
  // the same target and rely on the default name, IR build
  // refuses with a `why: ... fix: set explicit related_name on
  // at least one of the FK fields` diagnostic. Two FKs declaring
  // the SAME explicit related_name on the same target are
  // refused for the same reason.
  string related_name = 27;

  // Service-managed upload config (Slice A — file-upload feature).
  // Required when `type` is UPLOADED_FILE / UPLOADED_IMAGE; ignored
  // (must be unset) on every other type. Carries the storage
  // connection name + base bucket path + sub-bucketing knobs the
  // gateway uses to produce the final storage handle on POST.
  Upload upload = 28;

  // REV-031 (Phase C, 2026-05-09) — author-side validation message
  // overrides per rule type. Each entry is `{type, message}`; the
  // emitter uses the override when present, falls back to the
  // Django-style default catalog (lib/validation/defaults.go).
  // Messages support `{placeholder}` substitution at generate time
  // for static rule params (`{max}`, `{min}`, `{regex}`,
  // `{precision}`, `{scale}`, `{choices}`); the actual offending
  // value is appended at runtime per REV-028 (`(got %v)`).
  //
  // Per-field is the home for single-column rules (max_len, regex,
  // unique on this column). Multi-column constraints (composite
  // CHECK, multi-column unique) live on
  // `(w17.db.table).validation_messages` keyed by constraint name.
  //
  // Type can be repeated when a field has multiple-rule failures
  // surfaced separately (e.g. EMAIL has both REGEX and BLANK
  // checks); each (type, message) pair overrides one rule.
  // Duplicate type entries on the same field are a parse error
  // (ambiguous which message wins).
  repeated ValidationMessage validation_messages = 29;

  // REV-137 — declare this column as JSON-typed for DQL chain
  // navigation. When true, DQL's dotted-chain syntax treats segments
  // after this column as JSON path keys (rather than attempting FK
  // resolution); per-dialect emit renders them via the dialect's
  // native JSON extraction primitives (PG `->>`, MySQL
  // `JSON_UNQUOTE(JSON_EXTRACT(...))`, SQLite `json_extract`).
  //
  // Storage shape is unchanged — the column is still a string /
  // bytes column at the SQL level holding serialised JSON. The
  // annotation is a SCHEMA-LEVEL signal that the value's contents
  // are accessible through DQL's chain grammar.
  //
  // ENFORCEMENT (T2-6 pass #8, B-F6): both sides, because the read
  // side casts unconditionally. The migrator emits a JSON validity
  // CHECK on the column (PG `IS JSON`, MySQL `JSON_VALID`, SQLite
  // `json_valid`) and the generated validation block refuses a
  // non-JSON write with `INVALID_JSON` on that field.
  //
  // Why it has to be the DDL and not only the request side: a
  // JSON-path READ renders `col::jsonb->>'key'`, and a LIST arm puts
  // that cast in the WHERE — where it is evaluated for EVERY row. One
  // non-JSON row therefore failed the endpoint for every caller,
  // forever, and the engine's 22P02 maps to InvalidArgument, blaming
  // the READER for a value some earlier writer stored. The read
  // grammar this annotation turns on is only sound if the column
  // really holds JSON, so the schema now says so.
  //
  // A `json: true` column redirected to a native jsonb / json
  // `db_type` gets no synthesized CHECK — its column type is the
  // constraint.
  //
  // Usage:
  //   string profile = 5 [(w17.field) = {
  //     type: TEXT, json: true
  //   }];
  //   // DQL: `WHERE u.profile.contact.email = :email`
  //
  // Per the `dql-json-access` decision: chain navigation reads
  // ship in REV-137; the function catalog (CONTAINS / EXISTS /
  // JSON_LENGTH / …) lands in REV-139; dotted-key escape syntax
  // (`u.profile."contact.email"`) lands in REV-138.
  bool json = 30;

  // Computed choices — fills the CHECK IN (...) list at codegen
  // time from a project-internal lock file instead of an enum FQN.
  // Mutex with `choices`: setting both is a parse error (one
  // source of truth for the value set).
  //
  // Use case: a plugin / cross-domain model needs to constrain a
  // column to a set of values that are themselves generated by
  // wandering-compiler from the project's schema (e.g. ACL
  // permission codes, derived from `(w17.acl_*)` cascade on
  // models + endpoints). The author can't enumerate the codes
  // upfront (they're per-project), but the IR builder can read
  // the per-domain lock file the compiler already maintains.
  //
  // Lifecycle: `wc generate` refreshes the relevant lock file
  // (e.g. `proto/domains/<domain>/acl.lock.json`) before the IR
  // build pass. IR builder then reads the lock + emits a CHECK
  // constraint over `permissions ∪ reserved` (every string ever
  // allocated — `reserved` preserves removed codes so existing
  // rows don't violate the constraint after a permission is
  // dropped from the schema).
  //
  // Empty lock (`permissions` and `reserved` both empty) emits
  // `CHECK (false)` + a `diag.Warn` — the column accepts no rows
  // until the project configures the source. Intentional: free
  // text would let the author store codes that no protistrana
  // (gateway dispatch / acllock helpers) recognises, which is
  // worse than refusing the insert outright.
  //
  // The required carrier is per-VARIANT, and the pairing is enforced
  // at IR build time (either mismatch is a hard diag):
  //
  //   ACL_PERMISSIONS     — string carrier (CHECK over value NAMES)
  //   ACL_PERMISSION_IDS  — int32 / int64 carrier (CHECK over numbers)
  AutoChoices auto_choices = 31;

  // Locale-aware display format for this field's value — a template
  // the COMPILER parses and lowers to a (msgid, slots) pair; the
  // runtime never sees template syntax. Applies wherever the field
  // is rendered, so the default belongs here, once, next to the
  // model. `AdminColumn.format` overrides it for one list.
  //
  //   format: "{value|decimal:2}"
  //   format: "{qty|number|zero:_(\"none\")}"
  //   format: "{value|percent:1} of quota"
  //
  // The template must fill EXACTLY ONE slot — a field format renders
  // one value, so a second slot has no value to draw from. The
  // surrounding text becomes a msgid, so a translator can move the
  // slot to wherever their language puts it.
  //
  // Empty (default) = the preset implied by `type`: MONEY →
  // decimal:2, DECIMAL → decimal:<scale>, PERCENTAGE → percent,
  // RATIO → number, DATE → date, TIME → time, DATETIME → datetime,
  // NUMBER / COUNTER / SMALL_INTEGER → number. ID is deliberately
  // unformatted — grouping the digits of a row id ("1,234") reads as
  // a quantity it is not.
  //
  // The filter set is closed and its names are public contract; the
  // parser rejects an unknown filter at codegen time. Currency is
  // out of scope (no symbol, no per-currency decimals) — MONEY is a
  // 2-decimal number. Spec: docs/specs/i18n/formatting.md.
  string format = 32;

  // Field numbers 3 (fk) and 15 (orphanable) have moved to
  // (w17.db.column) — they're DB-specific rules (like indexes /
  // constraints), not data semantics. See D8 rev 2026-04-21 and D12.
  reserved 3, 15;
  reserved "fk", "orphanable";
}

// AutoChoices — source for a computed CHECK IN (...) list, resolved
// at IR build time from a project-internal lock file. Authored on
// `(w17.field).auto_choices`; mutex with `(w17.field).choices`.
//
// Forward-compat: numeric values are stable. New sources append
// (e.g. `EVENTBUS_TOPICS`, `FEATURE_FLAGS`). Adding a value is
// non-breaking; renaming or renumbering breaks every existing
// project that consumes that lock.
enum AutoChoices {
  AUTO_CHOICES_UNSPECIFIED = 0;

  // Choices = every permission value-name allocated in the
  // activating domain's `acl.lock.proto` enum (the
  // `AclPermission` enum's value names). Source of truth is
  // the per-domain ACL cascade + monotonic allocator (see
  // docs/specs/gateway/acl-permissions.md). Carrier must be
  // STRING. Empty lock → CHECK (false) + diag.Warn.
  ACL_PERMISSIONS = 1;

  // Choices = every permission NUMERIC ID allocated in the
  // activating domain's `acl.lock.proto` enum (the
  // `AclPermission` enum's numeric values). Same source as
  // ACL_PERMISSIONS but the carrier is INT32/INT64 (scalar or
  // repeated). Emits `CHECK col IN (1,2,3,...)` for scalar
  // carriers + `CHECK col <@ ARRAY[1,2,3,...]` (PG; equiv per
  // dialect) for repeated carriers. Pre-launch the only
  // consumer is `Role.permission_ids` in the auth plugin
  // (replaces the dropped Permission + RolePermission tables).
  ACL_PERMISSION_IDS = 2;
}

// ValidationMessage — one author override for one rule type on one
// field. REV-031 (Phase C, 2026-05-09).
//
// `message` supports static `{placeholder}` substitution at generate
// time. Available placeholders per type:
//
//   max_len           {max}
//   min_len           {min}
//   gt / gte          {min}
//   lt / lte          {max}
//   regex / pattern   {regex}
//   choices / enum    {choices}  (comma-joined enum names)
//   precision/scale   {precision}, {scale}
//   max_extension     {extensions}
//   percentage_range  {min}, {max}  (always 0, 100)
//   ratio_range       {min}, {max}  (always 0, 1)
//   unique / fk /     (no placeholders — value comes at runtime)
//   not_null / check
//
// Runtime appends `(got <value>)` per REV-028 — no placeholder for
// the actual offending value; the emitter wires it.
message ValidationMessage {
  ValidationType type = 1;
  string message = 2;
}

// ValidationType enumerates every rule the validator can emit. The
// type IDs are stable: adding a new validator means adding an enum
// value (never reusing one). Used by ValidationMessage.type to
// route author overrides to the right rule.
enum ValidationType {
  VALIDATION_TYPE_UNSPECIFIED = 0;

  // String / blob shape rules.
  VALIDATION_REQUIRED = 1;       // value missing on required field
  VALIDATION_BLANK = 2;          // empty string on blank=false
  VALIDATION_MAX_LEN = 3;        // string too long
  VALIDATION_MIN_LEN = 4;        // string too short
  VALIDATION_REGEX = 5;          // pattern mismatch (incl. SLUG / URL / MAC default regexes)
  VALIDATION_EMAIL = 6;          // mail.ParseAddress reject
  VALIDATION_URL = 7;            // URL format reject
  VALIDATION_UUID = 8;           // UUID shape reject
  VALIDATION_IP = 9;             // net.ParseIP reject
  VALIDATION_MAC_ADDRESS = 10;   // MAC pattern reject
  // T2-6 pass #8 (B-F6). `(w17.field).json = true` declares that DQL may
  // navigate INTO the value, and the read emitters cast the column
  // `::jsonb` to do it — including in a LIST arm's WHERE, which evaluates
  // the cast across every row. The write path bound raw text behind only a
  // blank CHECK, so one non-JSON row broke every JSON-path read of that
  // table for every caller (PG 22P02 → InvalidArgument, blaming the
  // READER for a value a previous writer stored). This rule is the
  // request-side half of closing that; the DDL CHECK is the other half.
  VALIDATION_JSON = 11;          // value is not a valid JSON document

  // Numeric rules.
  VALIDATION_GT = 20;            // value <= bound
  VALIDATION_GTE = 21;           // value < bound
  VALIDATION_LT = 22;            // value >= bound
  VALIDATION_LTE = 23;           // value > bound
  VALIDATION_PERCENTAGE_RANGE = 24; // outside [0, 100]
  VALIDATION_RATIO_RANGE = 25;   // outside [0, 1]
  VALIDATION_DECIMAL_PRECISION = 26; // exceeds declared precision/scale

  // Choice / enum rules.
  VALIDATION_CHOICES = 30;       // value not in declared choices
  VALIDATION_ENUM = 31;          // proto enum value out of range

  // Path-family rules.
  VALIDATION_PATH_EXTENSION = 40; // file path extension not in allow-list

  // DB-side constraint rules — author opts a constraint failure into
  // user-class validation by setting an override message; without
  // override the constraint failure stays internal-class (REV-026
  // PgError → Internal + Sentry).
  VALIDATION_UNIQUE = 50;             // PG SQLSTATE 23505
  VALIDATION_FK_VIOLATION = 51;       // PG SQLSTATE 23503
  VALIDATION_NOT_NULL = 52;           // PG SQLSTATE 23502
  VALIDATION_CHECK_CONSTRAINT = 53;   // PG SQLSTATE 23514
  VALIDATION_EXCLUSION = 54;          // PG SQLSTATE 23P01
}

// Upload — companion config for UPLOADED_FILE / UPLOADED_IMAGE
// fields. The gateway resolves `connection` to a KV-capability
// connection in the same domain, computes the final storage key
// from `bucket_path` + a hash-based sub-bucket prefix derived from
// `expected_objects` / `max_per_bucket`, streams the inbound
// multipart file part through a tmp file, hashes during write,
// then atomically moves the result under that key.
//
// Sub-bucket depth derivation:
//
//   capacity(depth) = max_per_bucket * 256^depth
//   depth           = ceil( log256( expected_objects / max_per_bucket ) )
//
// One sub-bucket level is one BYTE of the hash, so each level
// multiplies the number of leaf buckets by 256 — that 256, not
// max_per_bucket, is the base. `max_per_bucket` sets the leaf
// CAPACITY the depth has to keep you under, which is why it appears
// in the ratio rather than in the base.
//
// Final layout:
//
//   <bucket_path>/<sub_bucket_path>/<object_key>
//
// where sub_bucket_path is `<2 hex chars>/<2 hex chars>/...` taken
// from the first `2*depth` chars of sha256(object_key). Hash-based
// distribution is the only mode in MVP (uniform spread); sequential
// bucketing is a future opt-in.
message Upload {
  // Connection name, resolved at IR build time against every
  // `(w17.module).connection` in the compiled batch — a sibling
  // module's declaration counts, which is the usual shape (the
  // upload target is its own KV connection, the model's table is
  // relational). A name that resolves to nothing, or to a
  // connection whose resolved capability isn't KV, is a build
  // error. The connection's dialect picks the runtime driver
  // (`LOCAL_FS` today; `REDIS` / future `OBJECT_STORAGE`).
  //
  // Not checked when the batch declares no connections at all —
  // a subset compile can't tell a typo from a project default.
  string connection = 1;

  // Base path under the connection. Convention: starts with `/`
  // (e.g. `/avatars`, `/uploads/tasks`). Final keys live as
  // `<bucket_path>/<sub_bucket_path>/<object_key>`. Empty is a
  // parse error — the gateway refuses to write at the connection
  // root.
  string bucket_path = 2;

  // Expected total object count. Drives sub-bucket depth
  // derivation. Author's best-guess upper-bound (over-estimating
  // is cheap; under-estimating causes per-bucket file counts to
  // exceed `max_per_bucket` once N grows past the implied
  // ceiling).
  uint64 expected_objects = 3;

  // Max objects per leaf bucket (sub-directory). Constrains the
  // sub-bucket fanout. Filesystem-backed connections want
  // `<= 10000` to keep `ls` / `readdir` efficient on common
  // filesystems (ext4 unlimited but slows beyond ~10k entries
  // per dir; FAT32 hard-caps at 65k). KV-backed connections care
  // less — Redis has no fanout cap — but the same knob keeps the
  // depth derivation symmetric.
  uint32 max_per_bucket = 4;

  // Per-file size cap, in bytes. The gateway wraps the multipart
  // part reader with `http.MaxBytesReader`; uploads exceeding the
  // cap fail with HTTP 413 before any disk write.
  uint64 max_size_bytes = 5;
}

// Type — semantic subtype refining the proto carrier into a SQL column type
// and a default constraint set. Authoritative carrier × Type table is in
// docs/archive/iteration-1.md D2 + the "Preset Bundles" reference. Each Type is a
// preset that carries a cross-dialect storage choice, auto-synthesised
// CHECKs, required/default side-data, and compatibility rules with
// (w17.field).default_* variants.
//
// Convention exception (REV-014, 2026-05-06): the zero value is `AUTO`
// (not `*_UNSPECIFIED` per the proto3 norm). DSL ergonomics outweigh the
// wire-format convention here — `(w17.field)` is a build-time annotation
// consumed only by the wandering-compiler, never by third parties, and
// the AUTO-as-default reading lets `[(w17.field) = {}]` mean "DB column,
// infer carrier from proto kind". See REV-014 in docs/design-review-202605.md.
enum Type {
  // AUTO — infer the carrier from the proto kind. The mapping is:
  //
  //   bool                       → CARRIER_BOOL
  //   int32 / int64 / uint32 /   → ID when same-block `pk: true`,
  //   uint64                       else NUMBER
  //   float / double             → NUMBER (FLOAT-shaped storage)
  //   string                     → TEXT (CHAR is opt-in: requires max_len)
  //   bytes                      → BYTES carrier; sem stays UNSPECIFIED
  //   enum                       → ENUM (numeric carrier; choices from
  //                                the enum descriptor, *_UNSPECIFIED=0
  //                                stripped per proto3 norm)
  //   google.protobuf.Timestamp  → DATETIME
  //   google.protobuf.Duration   → INTERVAL
  //   repeated <T>               → list/array; element kind resolves
  //                                recursively (element-AUTO = the same
  //                                rules applied to <T>)
  //   map<K,V>                   → AUTO-as-collection (compiler picks
  //                                KV / JSON storage per dialect)
  //   message <Other>            → MESSAGE carrier; serialised whole as
  //                                JSONB by default, or BYTEA (protobuf
  //                                binary) via `(w17.db.column).db_type`.
  //                                AUTO is the ONLY type valid here — a
  //                                scalar refinement (CHAR / UUID / …) is
  //                                refused with a diag
  //
  // AUTO is the default when (w17.field) is present without `type:`
  // (`[(w17.field) = {}]`). Column-membership is a MODEL-level rule,
  // NOT keyed on `(w17.field)` presence (REV-014): on a
  // `(w17.db.table)`-marked message EVERY proto field is a DB column
  // by default. `(w17.field)` only *configures* the column
  // (type/pk/unique/validation) — it does not create or gate it. To
  // keep a field on a table message WITHOUT persisting it (computed,
  // RPC-only, request/response-shape, or a value a query projects in
  // via `... AS <field>`), opt it out explicitly with
  // `(w17.db.column) = { exclude: true }`. Fields on a NON-table
  // message (no `(w17.db.table)`) are never columns — nothing to
  // persist; `(w17.field)` there is a pure RPC-side validation hint.
  AUTO = 0;

  // String-carrier presets (carrier: string)
  CHAR  = 1;
  TEXT  = 2;
  UUID  = 3;
  EMAIL = 4;   // default max_len 320 (RFC 5321); override via max_len
  URL   = 5;   // default max_len 2048 (modern web practical max); override via max_len
  SLUG  = 6;
  JSON  = 7;   // structured JSON; PG → JSONB, MySQL → JSON, SQLite → TEXT.
               // Also valid on bytes carrier for when the caller holds a []byte.
  IP    = 8;   // IP address (v4/v6); PG → INET, MySQL → VARCHAR(45), SQLite → TEXT
  TSEARCH = 9; // full-text search document; PG → TSVECTOR, MySQL → TEXT + FULLTEXT index (iter-2), SQLite → TEXT + FTS5 (iter-2)
  MAC_ADDRESS = 60; // IEEE 802 MAC address; PG → MACADDR (native enforces format),
                    // MySQL/SQLite → VARCHAR(17) + regex CHECK. Author uses
                    // `db_type: VARCHAR` to force string storage on PG; regex
                    // CHECK activates automatically in that path.

  // Path-family presets (carrier: string). All three store as TEXT
  // on PG and emit a `blank: false` CHECK by default. D22d.
  POSIX_PATH = 61; // Generic filesystem path — no extension constraint
                   // (directories, executables, pipes). No regex CHECK
                   // beyond blank/length.
  FILE_PATH  = 62; // File path with required `extensions: [...]`. Regex
                   // CHECK enforces the allowed suffixes (case-insensitive).
                   // Use `["*"]` to allow any extension (disables the CHECK,
                   // author documents "this is a file but any ext is OK").
  IMAGE_PATH = 63; // FILE_PATH preset with a default `extensions:
                   //   ["jpg","jpeg","png","gif","webp","avif","svg"]`.
                   // Override the default by setting extensions: explicitly.

  // Service-managed upload presets (carrier: string). Mirror the
  // FILE_PATH / IMAGE_PATH passive variants but mark the field as
  // gateway-managed: a multipart endpoint with a FILE_PART binding
  // populates the field with the resulting storage handle, and the
  // gateway owns the actual file write into the configured KV
  // connection. The field's value at runtime is the storage handle
  // (the key under the connection — e.g. `/avatars/ab/cd/<sha>`),
  // NOT the file bytes.
  //
  // Business code reads those bytes back through the same handle: the
  // generated business bundle's ClientSet carries one `kvfs.Reader` per
  // upload connection the domain declares (`<Conn>Store()`), resolved
  // from the connection's bucket root, and the handle is passed to it
  // verbatim — it already carries bucket_path and sub-bucket. The reader
  // is READ-ONLY on purpose: the gateway derives keys and is the
  // connection's only writer, so a second writer would be a second key
  // layout. See docs/specs/bundles/business-service.md.
  //
  // Required companion config: `(w17.field).upload` submessage with
  // connection / bucket_path / sub-bucketing knobs. The parser
  // refuses an UPLOADED_* field without a populated upload submsg
  // and refuses a FILE_PART binding to a non-UPLOADED_* field.
  UPLOADED_FILE  = 64; // Service-managed upload, no extension preset.
                       // Operator declares the allowlist via
                       // `extensions: [...]`.
  UPLOADED_IMAGE = 65; // Service-managed image upload. Same image-MIME
                       // default extensions as IMAGE_PATH. Override by
                       // setting `extensions: [...]` explicitly.

  // Credential column (carrier: string). Declares that the column
  // HOLDS an encoded password hash
  // (`$argon2id$v=19$m=65536,t=3,p=4$<salt>$<digest>` or similar),
  // and shapes the surfaces around it accordingly.
  //
  // IT DOES NOT HASH. Hashing is plugin-owned (2026-05-25 rip-out of
  // REV-151's auto-hash track): storage codegen binds whatever bytes
  // the caller sent, verbatim. The auth plugin's handler calls
  // `passwordhash.Settings.Hash` before its mutation, and verifies
  // via `Verify` / `VerifyAndRotate`. A hand-written handler on a
  // PASSWORD column MUST hash before it writes — nothing downstream
  // will do it for you.
  //
  // What the type does give you:
  //   - storage TEXT (PG / SQLite) / VARCHAR(256) (MySQL)
  //   - pk refused, unique refused at IR build (salted hashes have no
  //     stable identity and never equality-compare)
  //   - max_len refused on a MODEL column — it sizes VARCHAR(N), and
  //     the stored value is the hash, not the plain text. On a
  //     REQUEST field (not a table) max_len + min_len are ordinary
  //     validation bounds on the plain text the caller typed.
  //   - excluded from the admin's default list columns and default
  //     detail-form fields; the detail form renders PasswordInput
  //     with "empty = don't change".
  //
  // NOT hidden from REST JSON responses — an RPC whose response
  // message carries the column serialises the hash like any other
  // string. Keep it off the response message if you don't want it on
  // the wire. Spec: docs/specs/storage/password-field.md.
  PASSWORD = 66;

  // Numeric carriers (carrier: int32 / int64 / double — see D2 table)
  NUMBER     = 10;
  ID         = 11;
  COUNTER    = 12;
  MONEY      = 13;
  PERCENTAGE = 14;
  RATIO      = 15;
  // Small integer (int32 carrier only). Storage: PG SMALLINT
  // (-32 768 .. 32 767), MySQL SMALLINT, SQLite INTEGER. Use when
  // the typical range is a known small set (status codes, ordinals,
  // priority 0-10) — halves the per-row cost vs INTEGER on PG.
  // D22c.
  SMALL_INTEGER = 70;

  // Arbitrary-precision decimal (carrier: string — lossless wire format).
  // Requires (w17.field).precision; (w17.field).scale is optional (default 0).
  // MONEY / PERCENTAGE / RATIO stay as fixed-shape double-carried presets;
  // reach for DECIMAL when you need precision/scale the presets don't cover.
  DECIMAL = 16;

  // Temporal (carrier: google.protobuf.Timestamp)
  DATE     = 20;
  TIME     = 21;
  DATETIME = 22;

  // Duration (carrier: google.protobuf.Duration)
  INTERVAL = 30;

  // Enumerated value (carrier: string / int32 / int64; also auto-inferred
  // on bare proto-enum fields). Dispatch per carrier:
  //   string  → PG `CREATE TYPE <table>_<col> AS ENUM (names…)` + column
  //             of that type; MySQL `ENUM(...)`; SQLite TEXT + CHECK IN names.
  //   int32/int64 → INTEGER / BIGINT column + CHECK IN (numbers…).
  //   proto-enum field (e.g. `Status s = 1;`) — auto-dispatches to int32
  //             carrier + ENUM sem + choices=FQN derived from the enum.
  // Requires `choices:` on the string-carrier path; on int and proto-enum
  // paths the numbers come from the enum descriptor (names stripped of the
  // *_UNSPECIFIED=0 sentinel per proto3 convention).
  ENUM = 50;
}

// AutoDefault — dynamically resolved default value. Emitters render each
// variant per dialect. IR builder rejects invalid carrier × AutoDefault
// combinations (see D7 table).
enum AutoDefault {
  AUTO_DEFAULT_UNSPECIFIED = 0;

  // Temporal — resolved per Type:
  //   DATE     → CURRENT_DATE
  //   TIME     → CURRENT_TIME
  //   DATETIME → NOW() / CURRENT_TIMESTAMP
  NOW = 1;

  // UUID generation — valid on string carrier with type UUID.
  UUID_V4 = 10;
  UUID_V7 = 11;

  // JSON literals — valid on string carrier (stored as '[]' / '{}') and on
  // JSONB carrier when JSONB lands (iter-2+). Reserved now for shape
  // stability.
  EMPTY_JSON_ARRAY  = 20;
  EMPTY_JSON_OBJECT = 21;

  // Bool — the only way to set a bool default.
  TRUE  = 30;
  FALSE = 31;

  // Auto-incrementing integer PK. Valid on int32 / int64 carrier with
  // type: ID and pk: true. Emitter renders per dialect:
  //   Postgres / Oracle / DB2 / SQL Server 2012+:
  //     GENERATED BY DEFAULT AS IDENTITY (SQL:2003 standard)
  //   MySQL:  AUTO_INCREMENT
  //   SQLite: INTEGER PRIMARY KEY AUTOINCREMENT (rowid-backed)
  IDENTITY = 40;

  // Cryptographically-safe random string. Valid only on string
  // carrier with type CHAR + max_len > 0. The storage codegen
  // mutation-handler preamble fills the column app-side at
  // INSERT time via the runtime's random-token helper (max_len) —
  // base64url-encoded random bytes truncated to `max_len`
  // characters. No DB-side DEFAULT clause emitted (no portable
  // cross-dialect "random string of length N" function).
  //
  // Generic w17 primitive — not auth-specific. Use for any
  // column needing an opaque random token: API keys, signed-
  // URL nonces, invite codes, bearer tokens, etc. The plugin
  // redesign 2026-05-22 ADR has the rationale.
  CRYPTO_RANDOM = 50;
}

// (w17.value_display) — generic per-enum-value UI metadata. The
// annotation is consumed by every layer that surfaces an enum
// value to a human: admin generator's Select / MultiSelect
// renderer, TS client's value-of-enum helpers, future
// audit-log + diff renderers.
//
// All three fields are optional. Consumers walk them in order:
//
//   - `label` empty → auto-derive from the proto value name
//     (`TASK_CREATED` → `"Task Created"`). Authors that want
//     a specific text override here; values left blank stay
//     deterministic + reasonable without per-value effort.
//   - `description` empty → consumers OMIT the description
//     line entirely (tooltip / help text simply doesn't render).
//     No fallback humanization for descriptions — the
//     human-readable label IS the description fallback.
//   - `deprecated` false → no special treatment; true → UI
//     renders the value but flags it (strikethrough, dimmed,
//     tooltip). Writes that assign a deprecated value get a
//     soft warning; reads keep working so existing rows stay
//     valid until the operator migrates them off.
//
// Usage:
//
//	enum TaskStatus {
//	  TASK_STATUS_UNSPECIFIED = 0;
//	  TASK_TODO       = 1 [(w17.value_display) = { label: "To do" }];
//	  TASK_IN_PROGRESS = 2 [(w17.value_display) = { label: "In progress" }];
//	  TASK_DONE       = 3 [(w17.value_display) = { label: "Done",
//	                                                description: "Closed; archived after 30 days." }];
//	  TASK_DEFERRED   = 4 [(w17.value_display) = { label: "Deferred",
//	                                                deprecated: true }];
//	}
//
// The generator-emitted lock enums (w17.lock.acl.proto's
// AclPermission, forthcoming w17.lock.events.proto's wrapper
// oneof) carry the annotation when their source schema
// supplies a label hint (e.g. `(w17.acl).label` on an RPC
// method when that surface is added) or fall back to
// humanize-from-name.
extend google.protobuf.EnumValueOptions {
  EnumValueDisplay value_display = 51009;
}

// EnumValueDisplay is the body of `(w17.value_display)`. Pure
// metadata — never affects DB shape, validation, or wire
// encoding; lives entirely in the rendering layer.
message EnumValueDisplay {
  // Human-readable label. Empty = auto-derive from the proto
  // value name (UPPER_SNAKE_CASE → "Upper Snake Case").
  string label = 1;

  // Long-form help / tooltip text. Empty = no description
  // line rendered.
  string description = 2;

  // Marks the value as deprecated. UI flags it visually +
  // soft-warns on new writes; reads keep working so existing
  // rows survive until migrated off.
  bool deprecated = 3;
}
