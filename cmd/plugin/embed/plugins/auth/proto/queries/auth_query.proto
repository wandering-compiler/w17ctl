    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetTokenWithType — resolve a token string into its owner + id +
  // kind (SESSION/API). The api_token Authenticate path calls this
  // first to branch on the credential class. Gated api_token.
  rpc GetTokenWithType(GetTokenWithTypeReq) returns (GetTokenWithTypeResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT t.user_id AS user_id, "
          "       t.id AS token_id, "
          "       t.token_type AS token_type "
          "FROM @module.UserToken t WHERE t.token = :token AND (t.expires_at IS NULL OR t.expires_at > NOW())"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetUserRolePermissionsByRealm — distinct permission IDs the user
  // holds through roles of the given realm (token_type). The realm
  // filter (Role.token_type = :token_type) is why a session token and
  // an API token for the same user resolve different permission sets.
  // Gated api_token (reads Role.token_type, an api_token column).
  rpc GetUserRolePermissionsByRealm(GetUserRolePermissionsByRealmReq) returns (GetUserRolePermissionsByRealmResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(rp.permission_id) AS permission_ids "
          "FROM @module.RolePermission rp "
          "JOIN @module.UserRole ur ON ur.role_id = rp.role_id "
          "JOIN @module.Role r ON r.id = ur.role_id "
          "WHERE ur.user_id = :user_id AND r.token_type = :token_type"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetUserHasWildcardRoleByRealm — TRUE when the user holds any role
  // of the given realm flagged `all_permissions`. Single-row bool: the
  // outer row is the user, the projection a correlated EXISTS over the
  // user's realm roles. The realm-aware Authenticate calls this before
  // GetUserRolePermissionsByRealm and, when TRUE, substitutes
  // acllock.GrantAll(lock) for the realm permission set (still narrowed
  // by any per-token subset). Gated api_token (reads Role.token_type).
  rpc GetUserHasWildcardRoleByRealm(GetUserHasWildcardRoleByRealmReq) returns (GetUserHasWildcardRoleByRealmResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT EXISTS(SELECT 1 FROM @module.UserRole ur "
          "              JOIN @module.Role r ON r.id = ur.role_id "
          "              WHERE ur.user_id = u.id AND r.token_type = :token_type "
          "                AND r.all_permissions = TRUE) AS all_permissions "
          "FROM @module.User u WHERE u.id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // GetTokenPermissionSubset — the per-token permission subset rows.
  // Empty = no narrowing. Authenticate intersects these with the realm
  // permissions for API tokens (narrow-only). Gated api_token.
  rpc GetTokenPermissionSubset(GetTokenPermissionSubsetReq) returns (GetTokenPermissionSubsetResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
