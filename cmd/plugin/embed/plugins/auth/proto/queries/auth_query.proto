syntax = "proto3";

// Auth plugin — AuthQuery read-only RPCs.
//
// Read primitives for the auth surface. The consumer's
// business layer composes these into SignIn / Authenticate-
// header-middleware / similar (see docs/specs/plugins/auth.md
// §"Composing into SignUp / SignIn" for the canonical shape).
//
// All methods are pure SELECTs through the standard
// `(w17.db.method).query` annotation; codegen emits the
// handler bodies generically — no plugin-specific handler
// surface.

package w17.contrib.auth;

// Plugin-internal cross-file import; C2 placeholder expansion
// rewrites `@self` at staging time to the activation's staged
// directory.
import "google/protobuf/timestamp.proto";
import "@self/types/models.proto";
import "w17/contrib.proto";
import "w17/db.proto";
import "w17/field.proto";
import "w17/paging.proto";

option go_package = "@project;@pkg";

message GetUserByEmailReq  { string email = 1; }
message GetUserByEmailResp { User user = 1; }

message GetUserByTokenReq  { string token = 1; }
message GetUserByTokenResp { User user = 1; }

message GetUserPermissionsReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string user_id = 1;
}
message GetUserPermissionsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  // Permission IDs from the activating domain's generated
  // AclPermission enum (w17.lock.acl.proto). Plugin handler
  // passes them through to AuthResp.permission_ids verbatim —
  // no bitset packing, no string→id mapping.
  repeated int32 permission_ids = 1;
}

message GetUserByTokenWithPermissionsReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string token = 1;
}
// UserWithPermissions packs identity + the deduped permission
// IDs the user holds across every assigned role. One SQL
// round-trip via ROWS_TO_ARRAY (Phase E1) — no separate
// permission lookup. `permission_ids` is always populated
// (never nil); an empty list means the user has no role
// assignments or none of their roles carry any permissions.
message GetUserByTokenWithPermissionsResp {
  option (w17.contrib.plugin_feature) = "rbac";
  User           user           = 1;
  repeated int32 permission_ids = 2;
  // token_id is the id of the UserToken the bearer resolved to — threaded
  // by Authenticate into AuthResp.session_token_id so base-tier Logout can
  // revoke exactly this session without ever seeing the raw token.
  string         token_id       = 3 [(w17.field) = { type: UUID }];
  // all_permissions — TRUE when the user holds any SESSION-realm role
  // flagged `all_permissions` (a wildcard/superadmin role). Authenticate
  // expands the grant to acllock.GrantAll(lock) when set, ignoring the
  // (empty) RolePermission rows a wildcard role carries. Surfaced from a
  // correlated EXISTS so the single round-trip stays intact.
  bool           all_permissions = 4;
}

// Signup role-assignment support (rbac). CountUsers backs the
// first-user determination (COUNT==1 right after the insert = bootstrap
// admin); GetFirstUserRoles / GetDefaultRoles return the role ids the
// turnkey SignUp assigns, driven by the seeded assign_first_user /
// assign_default Role columns. Realm-agnostic — the UserRole link does
// not carry realm; the realm only decides which roles count at auth.
message CountUsersReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message CountUsersResp {
  option (w17.contrib.plugin_feature) = "rbac";
  int64 count = 1;
}

// --- user_admin feature: turnkey admin user directory ---
// ListUsers backs the admin Users page list `source`; GetUser backs its
// detail `read` (returns the User model DIRECTLY, like GetRole — the
// detail read contract is "returns a single <model>"). Both deliberately
// project WITHOUT password_hash (a PASSWORD column that must never leave
// storage into an admin view). All gated user_admin.
message ListUsersReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}
message ListUsersResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated User users = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's user table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page. See docs/specs/gateway/cursor-paging.md §Admin-only paging.
  w17.Paging paging = 2;
}
message GetUserReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string user_id = 1;
}

message GetFirstUserRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message GetFirstUserRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated string role_ids = 1;
}

message GetDefaultRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message GetDefaultRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated string role_ids = 1;
}

// Role read side — backs the plugin-contributed admin role-management
// pages (ListRoles = list source, GetRole = detail read). rbac-gated.
// token_type is deliberately NOT selected (it is an api_token-gated
// column absent from the base Role table); the always-present rbac
// columns carry the management view.
message ListRolesReq {
  option (w17.contrib.plugin_feature) = "rbac";
}
message ListRolesResp {
  option (w17.contrib.plugin_feature) = "rbac";
  repeated Role roles = 1;

  // Cursor-paged like the other admin lists (the `w17.Paging` field IS
  // the declaration — see docs/specs/gateway/cursor-paging.md §Admin-only
  // paging). The role catalogue is bounded by declaration and rarely
  // outgrows one page, so in practice the SPA renders no pager at all
  // (the footer appears only once a second page exists) — but a project
  // with a long, generated role set pages like everything else instead
  // of being the one list that loads unbounded.
  w17.Paging paging = 2;
}
message GetRoleReq {
  option (w17.contrib.plugin_feature) = "rbac";
  string id = 1;
}

// --- api_token feature: realm-aware + subset-narrowed auth lookup ---
// These three back the gated realm-aware Authenticate path (handlers/
// apitoken.go): resolve a token's kind, pull the user's permissions
// for that realm, and (for API tokens) the token's permission subset.
// Authenticate intersects realm-perms ∩ subset in Go — no SQL
// subquery. All gated api_token. See docs/specs/plugins/auth-tokens-
// and-roles.md §3.

message GetTokenWithTypeReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token = 1;
}
message GetTokenWithTypeResp {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  string    token_id   = 2;
  TokenType token_type = 3;
}

message GetUserRolePermissionsByRealmReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  TokenType token_type = 2;
}
message GetUserRolePermissionsByRealmResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated int32 permission_ids = 1;
}

// Wildcard probe for the realm-aware path: does the user hold any
// role of this realm flagged `all_permissions`? A single-row bool
// (correlated EXISTS). When TRUE, the realm-aware Authenticate
// resolves realm permissions to acllock.GrantAll(lock) before the
// per-token subset intersection (so a narrowed API token still
// narrows, but an un-narrowed one gets the full catalogue).
message GetUserHasWildcardRoleByRealmReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  TokenType token_type = 2;
}
message GetUserHasWildcardRoleByRealmResp {
  option (w17.contrib.plugin_feature) = "api_token";
  bool all_permissions = 1;
}

message GetTokenPermissionSubsetReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id = 1;
}
message GetTokenPermissionSubsetResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated int32 permission_ids = 1;
}

// ApiTokenInfo — one API token's management view: id + label + audit
// timestamps, NEVER the secret token string. ListApiTokensByUser
// returns these for the token-management UI. api_token-gated.
message ApiTokenInfo {
  option (w17.contrib.plugin_feature) = "api_token";
  string                    id           = 1 [(w17.field) = { type: UUID }];
  string                    name         = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp expires_at   = 4;
  google.protobuf.Timestamp created_at   = 5;
}
message ListApiTokensByUserReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string    user_id    = 1;
  TokenType token_type = 2;
}
message ListApiTokensByUserResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated ApiTokenInfo tokens = 1;
}

// --- oauth feature: provider + identity lookups ---
// GetProviderByName resolves the provider the authorize/callback URL keys
// on (the handler checks `enabled` + does the token exchange + state HMAC
// with client_secret). GetOAuthIdentity finds an existing User↔subject
// link. Both gated `oauth`.

message GetProviderByNameReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string name = 1;
}
message GetProviderByNameResp {
  option (w17.contrib.plugin_feature) = "oauth";
  OAuthProvider provider = 1;
}

message GetOAuthIdentityReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string provider_id = 1;
  string external_id = 2;
}
message GetOAuthIdentityResp {
  option (w17.contrib.plugin_feature) = "oauth";
  OAuthIdentity identity = 1;
}

// --- two_factor feature: TOTP secret + MFA challenge lookups ---
// GetTotpSecret backs the enrollment state (totp_enrolled = confirmed)
// AND the VerifyMfa TOTP path (the handler decrypts `secret`).
// GetMfaChallenge loads the pending challenge VerifyMfa consumes. Both
// gated `two_factor`.

message GetUserByIdReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}
message GetUserByIdResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  User user = 1;
}

message GetTotpSecretReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1;
}
message GetTotpSecretResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  UserTotpSecret secret = 1;
}

message GetMfaChallengeReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1;
}
message GetMfaChallengeResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  MfaChallenge challenge = 1;
}

// --- devices feature: device lookup at sign-in + the mgmt list ---
// GetDeviceByIdentifier resolves the (user, identifier) device the
// sign-in handler upserts against; ListUserDevices backs the
// ListDevices management RPC. Both gated `devices`.

message GetDeviceByIdentifierReq {
  option (w17.contrib.plugin_feature) = "devices";
  string user_id    = 1;
  string identifier = 2;
}
message GetDeviceByIdentifierResp {
  option (w17.contrib.plugin_feature) = "devices";
  Device device = 1;
}

message ListUserDevicesReq {
  option (w17.contrib.plugin_feature) = "devices";
  string user_id = 1;
}
message ListUserDevicesResp {
  option (w17.contrib.plugin_feature) = "devices";
  repeated Device devices = 1;
}

// GetUserTenant resolves the authenticated principal's tenant —
// the `tenant_id` data scope, sourced from auth (never client-
// sent, per the data-scope rule). Behind `tenant_scope`: present
// only when the activation enables the tenant feature; the
// `User.tenant_id` column it reads is gated by the same tag, so
// the query and its column appear / disappear together.
message GetUserTenantReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string user_id = 1;
}
message GetUserTenantResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}

// GetTenantBySlug / GetTenantByDomain resolve a Tenant id from the
// request context at SignUp (slug from the URL `{tenant_slug}` path
// param, domain from the forwarded Host header). The SignUp handler
// stamps the result onto the new user's tenant_id. Both gated by
// `tenant_scope` — they read the Tenant table the same feature adds.
message GetTenantBySlugReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string slug = 1;
}
message GetTenantBySlugResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}
message GetTenantByDomainReq {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string domain = 1;
}
message GetTenantByDomainResp {
  option (w17.contrib.plugin_feature) = "tenant_scope";
  string tenant_id = 1;
}

// ── org_membership query request/response messages ──────────
//
// Read primitives for the multi-org (GitHub-style) membership model: one
// identity belongs to many Organizations via OrgMembership. The business
// ListMyOrgs RPC composes ListUserOrgs for the authed caller; the
// Authenticate org-scope decorator uses GetUserOrgBySlug to validate +
// resolve the request's active org.

// UserOrg is one organization the user belongs to, joined with the
// caller's role in it (the SELECT aliases map onto these fields).
message UserOrg {
  option (w17.contrib.plugin_feature) = "org_membership";
  string org_id = 1;
  string slug   = 2;
  string name   = 3;
  string kind   = 4; // private | company
  string role   = 5; // owner | admin | member
}

message ListUserOrgsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
}
message ListUserOrgsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated UserOrg orgs = 1;
}

message GetUserOrgBySlugReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string slug    = 2;
}

// Permissions scoped to one organization — realm-wide grants
// (UserRole.org_id IS NULL) plus the grants assigned inside that org.
// Mirrors GetUserByTokenWithPermissionsResp's permission half so the
// narrowing step can substitute one for the other.
message GetUserOrgPermissionsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
  string org_id  = 2;
}
message GetUserOrgPermissionsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated int32 permission_ids = 1;
  // all_permissions — TRUE when a wildcard role applies IN THIS ORG.
  // Expanded by Authenticate through acllock.GrantAll, same as the
  // unscoped probe; scoped here because a superadmin of one company is
  // not a superadmin of another.
  bool           all_permissions = 2;
}

// The no-active-org half of the pair above. A separate query rather
// than the same one called with an empty `org_id`: the column is a UUID
// and an empty string is not one, so the comparison would fail at the
// database rather than match nothing. A sentinel UUID would work but
// puts a magic value in the request; the predicate is short enough to
// state twice.
message GetUserRealmWidePermissionsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string user_id = 1;
}
message GetUserRealmWidePermissionsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated int32 permission_ids = 1;
  bool           all_permissions = 2;
}
message GetUserOrgBySlugResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  // Empty org_id = the user is NOT a member of an org with this slug
  // (unknown slug, or a real org they don't belong to).
  string org_id = 1;
  string role   = 2;
}

// ── org_membership admin surface (turnkey Organizations /
//    OrgMemberships pages) ────────────────────────────────────
//
// The per-user reads above (ListUserOrgs / GetUserOrgBySlug) back the
// CLI's own-org flows; these GLOBAL list + get reads back the admin
// preset's Organizations + OrgMemberships pages (a project can't author
// them itself — the tables are plugin-owned). All gated org_membership.
// The Get requests key on a bare `id` field so the admin detail id-stamp
// resolves against it regardless of the model name.

message ListOrganizationsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
}
message ListOrganizationsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated Organization organizations = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's organization table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page. See docs/specs/gateway/cursor-paging.md §Admin-only paging.
  w17.Paging paging = 2;
}

message GetOrganizationReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
}

message ListOrgMembershipsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
}

// OrgMembershipAdminRow — the OrgMemberships list projection (ADMIN-FK).
// NOT a `(w17.db.table)`: a read-only DTO the ListOrgMemberships DQL
// joins User + Organization into, so the admin list shows the member's
// EMAIL + the organization's NAME (both human handles) instead of the
// two raw UUIDs the link table stores.
//   - id           — the membership id; stamped into the detail link +
//                    `record.id` navigation. Not a rendered column.
//   - member       — u.email, the row's clickable human handle (opens the
//                    membership's OWN detail via detail_link_column).
//   - organization — the raw org_id, annotated by an AdminColumnRef to
//                    link to the Organizations page while rendering
//                    org_name (the org's name, not the UUID).
//   - org_name     — o.name, the ref's row-local title source (projected
//                    but not a rendered column).
// The member's user page is deliberately NOT linked: the Users page is
// gated by a DIFFERENT feature (user_admin) and may be absent, so an
// org_membership-only activation would carry a dangling ref. The email
// handle already identifies the member. Gated org_membership.
message OrgMembershipAdminRow {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id           = 1 [(w17.field) = { type: UUID }];
  string member       = 2;
  string organization = 3 [(w17.field) = { type: UUID }];
  string org_name     = 4;
  string role         = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListOrgMembershipsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  repeated OrgMembershipAdminRow memberships = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's membership table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page. See docs/specs/gateway/cursor-paging.md §Admin-only paging.
  w17.Paging paging = 2;
}

message GetOrgMembershipReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  string id = 1;
}

// ── user_admin: global session/token review ──────────────────
//
// UserToken has only per-user reads (api_token's ListApiTokensByUser);
// these GLOBAL list + get back the admin Sessions page (review + revoke
// tokens across every user). The projection NEVER includes the secret
// `token` column — only the base-tier id / user_id / created_at /
// expires_at. Gated user_admin (the same realm that manages accounts).

message ListUserTokensReq {
  option (w17.contrib.plugin_feature) = "user_admin";
}

// UserTokenAdminRow — the Sessions list projection (ADMIN-FK). NOT a
// `(w17.db.table)`: a read-only DTO the ListUserTokens DQL joins User
// into, so the admin list shows the session owner's EMAIL (a human
// handle) + a link to their Users page instead of a bare user UUID —
// Django-admin discipline (no raw ids in a list an operator reads).
//   - id      — the token id; the admin runtime stamps it into the
//               detail link + `record.id` navigation. Deliberately not
//               among the page's rendered `columns` (it stays a UUID).
//   - owner   — u.email, the row's clickable human handle (opens the
//               session's OWN detail via detail_link_column).
//   - user    — the raw user_id, annotated by an AdminColumnRef to link
//               to the Users page. The ref declares NO `title`, so the
//               cell renders the column header ("User") with the id in
//               its tooltip — the email already shows who it is, and a
//               title here would just repeat `owner` in the next cell.
// NEVER carries the secret `token` value. Gated user_admin.
message UserTokenAdminRow {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id        = 1 [(w17.field) = { type: UUID }];
  string owner     = 2;
  string user      = 3 [(w17.field) = { type: UUID }];
  reserved 4;
  reserved "link_text";
  google.protobuf.Timestamp created_at = 5;
  // expires_at is NULL for a never-expiring API token, so the row field has
  // to declare it: the annotation is what makes the row scan a SQL NULL
  // (sql.NullTime) instead of failing on it, and — now that this list is
  // cursor-paged — what tells the admin auto-sort to leave the column out
  // of the sortable set (a keyset seek on a NULL key silently drops rows).
  // A read-projection row is not the model, so nothing else carries this.
  google.protobuf.Timestamp expires_at = 6 [(w17.field) = { type: DATETIME, null: true }];
}

message ListUserTokensResp {
  option (w17.contrib.plugin_feature) = "user_admin";
  repeated UserTokenAdminRow tokens = 1;

  // Cursor-paged (admin-only): the `w17.Paging` field on the response IS
  // the declaration — this list has no public REST endpoint to hang a
  // `paged{}` config on. The admin list handler decodes `?cursor` /
  // `?limit` (25 default, 100 max) and the storage query keyset-seeks on
  // this method's ORDER BY. An operator's session table grows without bound,
  // so an unpaged list would eventually load the whole table into one
  // page. See docs/specs/gateway/cursor-paging.md §Admin-only paging.
  w17.Paging paging = 2;
}

message GetUserTokenReq {
  option (w17.contrib.plugin_feature) = "user_admin";
  string id = 1;
}

// AuthQuery — read-only DB lookups.
//
// `GetUserByEmail` is the canonical "I have credentials" entry
// point: returns the User row (including password_hash) so the
// consumer's business layer can call passwordhash.Verify.
//
// `GetUserByToken` is the canonical "I have a bearer token"
// entry point — typically called from gateway middleware to
// populate request context from the Authorization header.
//
// `GetUserPermissions` is the canonical "give me everything
// this user can do" entry point — the project's hand-written
// `Authenticate` RPC composes it with `GetUserByToken` and
// passes the returned int32 IDs straight into
// `AuthResp.permission_ids` (no packing, no string→id mapping;
// the activating domain's AclPermission proto enum IS the
// catalog). Returns the deduped union of permission IDs across
// every role the user holds; empty list means the user has no
// role assignments (no permissions).
service AuthQuery {
  rpc GetUserByEmail(GetUserByEmailReq) returns (GetUserByEmailResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        // disabled_at is projected under `user_admin` and only there:
        // the column exists only when that feature is active, and
        // SignIn's disabled-account gate reads it off THIS lookup. A
        // gate on the projection target is what makes one statement
        // serve both activations — see docs/decisions/dql-feature-
        // gated-fragments.md §SELECT targets. Without it the gate
        // consulted a field this SELECT never filled, so every
        // soft-disabled account still signed in (T2-6 pass #9, D9-4).
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       u.created_at AS user.created_at, "
          "       ?feature(user_admin) u.disabled_at AS user.disabled_at "
          "FROM @module.User u WHERE u.email = :email"
      }
    };
  }

  rpc GetUserByToken(GetUserByTokenReq) returns (GetUserByTokenResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       u.created_at AS user.created_at "
          "FROM @module.User u JOIN @module.UserToken t ON t.user_id = u.id WHERE t.token = :token AND (t.expires_at IS NULL OR t.expires_at > NOW())"
      }
    };
  }

  // GetUserPermissions — flattens UserRole → RolePermission for
  // one user and returns the permission IDs (referencing the
  // activating domain's generated AclPermission enum) as a single
  // ROWS_TO_ARRAY list on the response's `repeated` field (a bare
  // `SELECT rp.permission_id` is one-per-row and can't scan into a
  // repeated scalar — the codegen decodes repeated scalars from an
  // array column). Empty list when the user has no roles / none of
  // their roles carry permissions (ROWS_TO_ARRAY never returns NULL).
  // Two roles overlapping on a permission can list an id twice; that
  // is harmless for the membership check the consumer runs (dedup via
  // `array_agg(DISTINCT …)` isn't expressible — the DQL has no
  // aggregate-DISTINCT — and matches GetUserByTokenWithPermissions).
  rpc GetUserPermissions(GetUserPermissionsReq) returns (GetUserPermissionsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT ROWS_TO_ARRAY(rp.permission_id) AS permission_ids "
          "FROM @module.RolePermission rp "
          "JOIN @module.UserRole ur ON ur.role_id = rp.role_id "
          "WHERE ur.user_id = :user_id"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // GetUserByTokenWithPermissions — the canonical auth-backend
  // lookup. ONE round-trip resolves the bearer token into the
  // User row + the deduped permission IDs the user holds.
  // Hand-written Authenticate composes:
  //
  //   resp, _ := authQuery.GetUserByTokenWithPermissions(...)
  //   return &AuthResp{PermissionIds: resp.GetPermissionIds()}
  //
  // Notes on the DQL:
  //   - LEFT JOIN through UserRole / RolePermission means a
  //     user with no roles still yields one row (rather than
  //     NotFound); the ROWS_TO_ARRAY then carries an empty
  //     list. The token JOIN stays inner — no token, no row,
  //     and the consumer's gateway middleware returns 401.
  //   - GROUP BY pins the row to the User's primary identity
  //     so the aggregate folds the join cross-product into one
  //     row per user.
  //   - ROWS_TO_ARRAY (Phase E1) maps per-dialect to PG
  //     `array_agg + FILTER + COALESCE`, MySQL `JSON_ARRAYAGG`,
  //     SQLite `json_group_array` — always returns a list,
  //     never NULL. The repeated-scalar scan path (Phase E2)
  //     decodes the column into `[]int32` regardless of which
  //     wire shape the dialect chose.
  //   - DISTINCT-equivalent dedup: the M2M topology guarantees
  //     unique (user_id, permission_id) pairs via the composite-
  //     unique indexes on UserRole + RolePermission, so the
  //     aggregate doesn't observe duplicates even across
  //     multiple roles overlapping on a permission.
  //
  // Permission table is gone (the activating domain's
  // AclPermission proto enum IS the catalog). RolePermission.
  // permission_id carries the int32 enum value directly.
  rpc GetUserByTokenWithPermissions(GetUserByTokenWithPermissionsReq) returns (GetUserByTokenWithPermissionsResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          "SELECT u.id AS user.id, "
          "       u.email AS user.email, "
          "       u.password_hash AS user.password_hash, "
          "       u.created_at AS user.created_at, "
          "       t.id AS token_id, "
          "       EXISTS(SELECT 1 FROM @module.UserRole urw "
          "              JOIN @module.Role rw ON rw.id = urw.role_id "
          "              WHERE urw.user_id = u.id AND rw.all_permissions = TRUE) AS all_permissions, "
          "       ROWS_TO_ARRAY(rp.permission_id) AS permission_ids "
          "FROM @module.User u "
          "JOIN @module.UserToken t ON t.user_id = u.id "
          "LEFT JOIN @module.UserRole ur ON ur.user_id = u.id "
          "LEFT JOIN @module.RolePermission rp ON rp.role_id = ur.role_id "
          "WHERE t.token = :token AND (t.expires_at IS NULL OR t.expires_at > NOW()) "
          "GROUP BY u.id, u.email, u.password_hash, u.created_at, t.id"
      }
    };
    // RBAC tables (UserRole / RolePermission) are joined here;
    // this query can't run without them. Tag matches the RBAC
    // table tag — when `rbac` is off, the query drops too.
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // CountUsers — total user count. The turnkey SignUp handler reads it
  // right after the insert: count == 1 ⇒ this is the first registered
  // user ⇒ assign the bootstrap-admin (first_user) roles. rbac-gated
  // (only the role-assignment path calls it).
  rpc CountUsers(CountUsersReq) returns (CountUsersResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql: "SELECT COUNT(*) AS count FROM @module.User u"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "rbac";
  }

  // ListUsers — the admin Users page catalogue. Projects the safe
  // columns only (NO password_hash) into the repeated User; newest
  // first. Gated user_admin.
  rpc ListUsers(ListUsersReq) returns (ListUsersResp) {
