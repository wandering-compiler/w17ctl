  // ListApiTokensByUser — the caller's API tokens (management view, no
  // secret token string). Filtered to token_type = :token_type (handler
  // stamps API). Newest first. Gated api_token.
  rpc ListApiTokensByUser(ListApiTokensByUserReq) returns (ListApiTokensByUserResp) {
    option (w17.db.method) = {
      ops: {
        name: "main"
        dql:
          // FLAT aliases, matching the repeated ELEMENT's fields. A
          // list-shaped response scans into ApiTokenInfo, so a
          // `tokens.`-prefixed path walks the wrapper field name on the
          // element and fails ("segment \"tokens\" not found on
          // ApiTokenInfo"). The nested form above (GetUserByEmail's
          // `u.id AS user.id`) is for a response that wraps ONE message;
          // this one is the ListUsers shape. Nothing caught it because
          // api_token is off by default and no example activated it, so
          // this query had never been emitted.
          "SELECT t.id AS id, "
          "       t.name AS name, "
          "       t.last_used_at AS last_used_at, "
          "       t.expires_at AS expires_at, "
          "       t.created_at AS created_at "
          "FROM @module.UserToken t "
          "WHERE t.user_id = :user_id AND t.token_type = :token_type "
          "ORDER BY t.created_at DESC"
      }
    };
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

