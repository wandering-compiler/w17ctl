syntax = "proto3";

// Auth plugin — AuthService (turnkey gateway-facing auth).
//
// AuthService.Authenticate is the zero-code wire-up between
// the project's REST surface (`(w17.rest_api).auth_methods[]`)
// and the auth plugin's primitives (AuthQuery /
// AuthMutation). Activating the plugin + referencing this
// RPC's per-activation FQN in `auth_methods[].ref` is the
// entire integration — no hand-written `Authenticate` body
// on the project side.
//
// The plugin author's contract:
//   - AuthReq mirrors the gateway's required shape:
//     `map<string, string> headers = 1` (validated by the
//     gateway parser; see srcgo/domains/gateway/parser/parser.go
//     §validateAuthRequestShape).
//   - AuthResp carries the two fields the gateway router
//     consumes: `repeated int32 permission_ids` (the deduped
//     numeric IDs of granted permissions from the activating
//     domain's AclPermission enum, mandatory when any model /
//     endpoint declares ACL) + `string user_id` (the
//     authenticated principal — UUID across the plugin's
//     identifier strategy; see types/models.proto §"Identifier
//     strategy").
//
// The v4 hand-written handler resolves User +
// `permission_ids` via the existing
// GetUserByTokenWithPermissions DQL and passes the int32 list
// straight through into AuthResp — no bit-packing, no string
// lookup. Gateway emits per-handler
// `acllock.HasPermission(ids, int32(pb.AclPermission_X))`
// checks against the slice.
//
// Project-side activation snippet:
//
//   option (w17.domain).plugins = {
//     source_name: "auth"
//     connections: { main: "forge-postgres" }
//     channels:    { events: "auth-events" }
//     // OPTIONAL — defaults Authorization / Bearer.
//     auth_input: { header_name: "Authorization", scheme: "Bearer" }
//   };
//
//   option (w17.rest_api) = {
//     auth_methods: [
//       { ref: "forge.auth.AuthService.Authenticate",
//         token_types: [TOKEN_TYPE_BEARER] }
//     ]
//   };
//
// Custom-auth path: projects that want a different sign-in
// flow (e.g. OAuth, SAML, federated identity) author their
// own `<Name>Service.Authenticate` in a project domain and
// point `auth_methods[].ref` at that RPC — the plugin's
// turnkey AuthService coexists with hand-authored alternatives.

package w17.contrib.auth;

import "google/protobuf/timestamp.proto";
import "@self/queries/auth_query.proto";
import "w17/contrib.proto";
import "w17/field.proto";

option go_package = "@project;@pkg";

// AuthReq matches the gateway's parser-enforced auth contract:
// every HTTP header on the inbound request lands in `headers`
// (lower-case keys, comma-joined values for multi-occurrence
// headers per the gateway convention). The generated handler
// pulls the configured auth header off the map, strips the
// scheme prefix, and resolves the bearer token.
message AuthReq {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
  map<string, string> headers = 1;
}

// AuthResp matches the gateway's auth contract. The router
// reads `permission_ids` to seed the per-request ACL check
// (validateAuthResponseShape rejects an AuthResp missing this
// field when any surface model / endpoint has effective ACL).
// The list carries the numeric values of the activating
// domain's `AclPermission` enum (`w17.lock.acl.proto`) — same
// underlying int32 the storage layer hands the plugin in
// `GetUserByTokenWithPermissionsResp.permission_ids`. Gateway
// emits per-handler
// `acllock.HasPermission(ids, int32(pb.AclPermission_X))`
// checks against the slice.
//
// `user_id` carries the authenticated principal — UUID across
// the plugin (types/models.proto §"Identifier strategy"). The
// `(w17.field).type = UUID` annotation drives validation on
// the wire shape end-to-end.
//
// `scopes` carries REV-147 data-scope values the gateway threads
// into outgoing gRPC metadata as `x-w17-scope-<name>`, for the
// storage codegen's per-model `(w17.db.scope)` auto-stamp (INSERT)
// + auto-WHERE (SELECT). The plugin publishes the canonical
// `scopes["user_id"]` = the authenticated user's id; a consuming
// project scopes its owned tables by referencing scope name
// `user_id` with its own owner column as the path (e.g.
// `(w17.db.scope) entries: [{ name: "user_id", path: "owner_id" }]`).
message AuthResp {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
  repeated int32      permission_ids = 1;
  string              user_id        = 2 [(w17.field) = { type: UUID }];
  map<string, string> scopes         = 3;
  // session_token_id is the id of the UserToken the bearer resolved to.
  // The gateway forwards the whole AuthResp to handlers as the user
  // envelope, so Logout reads this id from the envelope and revokes
  // exactly the current session — without the raw bearer ever reaching a
  // backend handler. Empty when the auth backend can't resolve an id.
  string              session_token_id = 4 [(w17.field) = { type: UUID }];

  // `labels` is the BROADCAST tenancy key, and it is deliberately NOT
  // `scopes` under another name.
  //
  // A scope filters ROWS. A label decides who an EVENT reaches: the
  // gateway stamps each entry onto the request as `w17-label-<name>`, the
  // emit path copies those onto every event the request produces, and the
  // /w17-events hub delivers an event to a connected client only when the
  // client's own labels satisfy it.
  //
  // The two overlap but are not the same set, which is the whole reason
  // this field exists separately. `scopes["user_id"]` scopes a row to its
  // OWNER; labelling events with it would shrink a public stream to the
  // one user who caused each event. So a decorator publishes a label only
  // for a key that genuinely partitions the AUDIENCE — org_id does, and
  // the org_membership feature stamps it.
  //
  // Empty (the default, and every project that publishes no label) means
  // events go out unlabelled and every authenticated client receives them
  // — the single-tenant posture, unchanged.
  map<string, string> labels = 5;
}

// SignInReq / SignInResp — canonical email+password sign-in
// turnkey. The plugin's hand-written SignIn handler resolves the
// user via AuthQuery.GetUserByEmail, runs the plugin-owned
// passwordhash.Settings.VerifyAndRotate against the stored hash,
// and delegates to AuthMutation.IssueToken on success. Every
// failure mode (no such email, wrong password, transient DB
// error) maps to a single opaque Unauthenticated status —
// anti-enumeration.
message SignInReq {
  option (w17.contrib.plugin_feature) = "sign_in_turnkey";
  string email    = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  string password = 2 [(w17.field) = { type: PASSWORD }];
}
message SignInResp {
  option (w17.contrib.plugin_feature) = "sign_in_turnkey";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string token   = 2;

  // two_factor — when a challenge is raised SignIn returns
  // mfa_required=true + a challenge_id INSTEAD of a token; the client
  // then calls VerifyMfa. Field-gated `two_factor`: both fields drop when
  // the feature is off, so a non-2FA project sees the unchanged
  // {user_id, token} shape (and a 2FA project sees them zero-valued on a
  // login that didn't challenge).
  bool   mfa_required = 3 [(w17.contrib.plugin_feature_field) = "two_factor"];
  string challenge_id = 4 [(w17.contrib.plugin_feature_field) = "two_factor"];

  // C2 — the server-minted device-trust token for this login (devices
  // feature). The client stores it and replays it as `X-Device-Trust` on
  // the next sign-in so a trusted device skips new-device 2FA without
  // relying on a client-chosen X-Device-Id. Rotated every login; the
  // client overwrites its stored token only when this is non-empty. Empty
  // on an mfa_required response (no session issued yet).
  string device_trust_token = 5 [(w17.contrib.plugin_feature_field) = "devices"];
}

// SignUpReq / SignUpResp — canonical register-and-issue-token
// turnkey. The plugin's hand-written SignUp handler hashes the
// plain-text `password` via the plugin-owned
// passwordhash.Settings.Hash, calls AuthMutation.CreateUser
// with the encoded `password_hash`, then AuthMutation.IssueToken
// for the new user. Duplicate email surfaces as AlreadyExists;
// transient DB errors propagate verbatim.
message SignUpReq {
  option (w17.contrib.plugin_feature) = "sign_up_turnkey";
  string email    = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
  string password = 2 [(w17.field) = { type: PASSWORD }];
  // tenant_slug — the URL-based tenant identifier, bound at the
  // gateway from a `{tenant_slug}` path placeholder (PATH_VAR). Field-
  // gated by `tenant_scope`: present only when BOTH sign_up_turnkey
  // (the message) and tenant_scope are on. The handler resolves it to
  // a tenant id; host-based tenancy reads the forwarded Host header
  // instead, so this stays empty there.
  string tenant_slug = 3 [
    (w17.field) = { type: SLUG, max_len: 100, null: true },
    (w17.contrib.plugin_feature_field) = "tenant_scope"
  ];
}
message SignUpResp {
  option (w17.contrib.plugin_feature) = "sign_up_turnkey";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string token   = 2;
}

// WhoAmIReq / WhoAmIResp — current-principal probe. The FE calls
// WhoAmI with a bearer token + empty body to confirm the session
// is still valid (a 401 means the token expired / was revoked).
// No body: the gateway's auth_method (Authenticate) validates the
// bearer per-request and threads the authenticated principal into
// `x-w17-scope-user_id` gRPC metadata; the handler echoes that
// back. Zero storage round-trips — the scope value IS the proof
// of a valid token.
message WhoAmIReq {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
}
message WhoAmIResp {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
  string user_id = 1 [(w17.field) = { type: UUID }];
}

// LogoutReq / LogoutResp — revoke the CURRENT session (base-tier, no
// `devices` feature). No body: the handler reads the authenticated
// principal (user_id) + the resolved session_token_id from the gateway's
// auth envelope and deletes exactly that one SESSION token. Idempotent —
// a logout against an already-revoked / expired session still succeeds.
// "Log out everywhere / other devices" is the `devices` feature's job
// (RevokeAllDevices); this revokes only the bearer that made the call.
message LogoutReq {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
}
message LogoutResp {
  option (w17.contrib.plugin_feature) = "authenticate_turnkey";
}

// ── api_token: token-management business surface ────────────
// Authenticated by the caller's SESSION bearer (you manage your
// API tokens from the browser). The handler reads the principal
// from the gateway-threaded x-w17-scope-user_id metadata (like
// WhoAmI), so no token field on the request.

message CreateApiTokenReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string name = 1 [(w17.field) = { type: CHAR, max_len: 128, blank: true }];
  // Optional least-privilege subset — permission IDs this token may use.
  // The effective set is always the INTERSECTION with the caller's
  // API-realm perms (an out-of-realm entry is dropped at Authenticate),
  // so a token can never escalate. Empty = full API-realm perms.
  repeated int32 permission_subset = 2;
}
message CreateApiTokenResp {
  option (w17.contrib.plugin_feature) = "api_token";
  // The opaque token string — returned ONCE at creation; never
  // retrievable again (ListApiTokens omits it).
  string token    = 1;
  string token_id = 2 [(w17.field) = { type: UUID }];
}

message ListApiTokensReq {
  option (w17.contrib.plugin_feature) = "api_token";
}
message ListApiTokensResp {
  option (w17.contrib.plugin_feature) = "api_token";
  repeated ApiTokenInfo tokens = 1;
}

message RevokeApiTokenReq {
  option (w17.contrib.plugin_feature) = "api_token";
  string token_id = 1 [(w17.field) = { type: UUID }];
}
message RevokeApiTokenResp {
  option (w17.contrib.plugin_feature) = "api_token";
}

// ── oauth: authorize-redirect + callback surface ────────────
// Both unauthenticated (the caller has no token yet); `provider` binds
// from the URL slug. All gated `oauth`.

message OAuthAuthorizeURLReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string provider       = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string redirect_after = 2; // where the SPA wants to land post-login
}
message OAuthAuthorizeURLResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string authorize_url = 1;
}

message OAuthCallbackReq {
  option (w17.contrib.plugin_feature) = "oauth";
  string provider = 1 [(w17.field) = { type: SLUG, max_len: 64 }];
  string code     = 2;
  string state    = 3;
}
message OAuthCallbackResp {
  option (w17.contrib.plugin_feature) = "oauth";
  string user_id        = 1 [(w17.field) = { type: UUID }];
  string token          = 2;
  string redirect_after = 3;
  // C2 — server-minted device-trust token (see SignInResp). OAuth bypasses
  // 2FA, but it still mints + rotates the device-trust token so a later
  // password sign-in on the same device is recognised as trusted.
  string device_trust_token = 4 [(w17.contrib.plugin_feature_field) = "devices"];
}

// ── two_factor: enrollment + challenge verification surface ──
// EnrollTotp / ConfirmTotp / DisableTotp / GetMfaStatus are bearer-
// authenticated (the user manages their own factor). VerifyMfa is NOT —
// it carries a challenge_id (the caller has no token yet). All gated
// `two_factor`.

message EnrollTotpReq {
  option (w17.contrib.plugin_feature) = "two_factor";
}
message EnrollTotpResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  // The base32 secret (shown once) + the otpauth:// URI the client
  // renders as a QR code. The secret is also stored encrypted server-side.
  string secret      = 1;
  string otpauth_uri = 2;
}

message ConfirmTotpReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string code = 1;
}
message ConfirmTotpResp {
  option (w17.contrib.plugin_feature) = "two_factor";
}

message DisableTotpReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  // B1 — a current TOTP code, re-verified before a CONFIRMED
  // authenticator is removed so a hijacked session can't permanently
  // disable the victim's 2FA (a transient compromise then can't
  // weaken the account). Ignored when no confirmed authenticator
  // exists (nothing to protect). Same decrypt+verify as ConfirmTotp.
  string code = 1;
}
message DisableTotpResp {
  option (w17.contrib.plugin_feature) = "two_factor";
}

message GetMfaStatusReq {
  option (w17.contrib.plugin_feature) = "two_factor";
}
message GetMfaStatusResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  bool totp_enrolled = 1;
}

message VerifyMfaReq {
  option (w17.contrib.plugin_feature) = "two_factor";
  string challenge_id = 1 [(w17.field) = { type: UUID }];
  string code         = 2;
}
message VerifyMfaResp {
  option (w17.contrib.plugin_feature) = "two_factor";
  string user_id = 1 [(w17.field) = { type: UUID }];
  string token   = 2;
  // C2 — server-minted device-trust token (see SignInResp). Issued here
  // because passing VerifyMfa is exactly the new-device 2FA pass that
  // should let the device skip the challenge next time.
  string device_trust_token = 3 [(w17.contrib.plugin_feature_field) = "devices"];
}

// ── devices: device/session management business surface ─────
// Authenticated by the caller's bearer (you manage your own
// devices). The principal comes from the gateway-threaded
// x-w17-scope-user_id metadata (like WhoAmI), so no token field.
// All gated `devices`.

// DeviceInfo — one device's management view: identity + audit +
// the two derived booleans the handler computes (never stored):
// `trusted` (trusted_at present) and `current` (this device is the
// one the calling request resolved to). Never carries the raw
// identifier (a fingerprint hash is an internal detail).
message DeviceInfo {
  option (w17.contrib.plugin_feature) = "devices";
  string                    id           = 1 [(w17.field) = { type: UUID }];
  string                    label        = 2;
  string                    ip           = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  bool                      trusted      = 5;
  bool                      current      = 6;
}

message ListDevicesReq {
  option (w17.contrib.plugin_feature) = "devices";
}
message ListDevicesResp {
  option (w17.contrib.plugin_feature) = "devices";
  repeated DeviceInfo devices = 1;
}

message RevokeDeviceReq {
  option (w17.contrib.plugin_feature) = "devices";
  string device_id = 1 [(w17.field) = { type: UUID }];
}
message RevokeDeviceResp {
  option (w17.contrib.plugin_feature) = "devices";
}

message RevokeOtherDevicesReq {
  option (w17.contrib.plugin_feature) = "devices";
}
message RevokeOtherDevicesResp {
  option (w17.contrib.plugin_feature) = "devices";
}

message RevokeAllDevicesReq {
  option (w17.contrib.plugin_feature) = "devices";
}
message RevokeAllDevicesResp {
  option (w17.contrib.plugin_feature) = "devices";
}

// AuthService — turnkey auth surface. The activating project
// references `<domain>.<registered_as>.AuthService.Authenticate`
// in `(w17.rest_api).auth_methods[].ref`; the gateway parser
// resolves the RPC, the plugin codegen emits the body. No
// project-side glue.
//
// Service-level `authenticate_turnkey` tag: the entire service
// drops at staging time when the activation doesn't enable the
// feature. Implicit dependency on `rbac` since the turnkey body
// delegates to AuthQuery.GetUserByTokenWithPermissions (which
// joins the RBAC tables). A future declared-dependency
// mechanism will make this explicit; today the failure mode is
// a Go compile error pointing at the missing delegate.
service AuthService {
  // Service-level tag would cascade to SignIn / SignUp too, but
  // each turnkey has its own opt-in feature tag — the service is
  // untagged here so every rpc carries an explicit method-level
  // tag. Authenticate → `authenticate_turnkey`, SignIn →
  // `sign_in_turnkey`, SignUp → `sign_up_turnkey`.
  rpc Authenticate(AuthReq) returns (AuthResp) {
    option (w17.contrib.plugin_feature_rpc) = "authenticate_turnkey";
  }
  rpc SignIn(SignInReq) returns (SignInResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_in_turnkey";
  }
  rpc SignUp(SignUpReq) returns (SignUpResp) {
    option (w17.contrib.plugin_feature_rpc) = "sign_up_turnkey";
  }
  // WhoAmI — verify the current bearer + return the principal.
  // Authenticated like any non-excluded endpoint; the body is
  // empty because the principal arrives via the gateway's
  // x-w17-scope-user_id metadata threading.
  rpc WhoAmI(WhoAmIReq) returns (WhoAmIResp) {
    option (w17.contrib.plugin_feature_rpc) = "authenticate_turnkey";
  }
  // Logout — revoke the caller's CURRENT session token (base-tier, no
  // `devices` feature). Reads user_id + session_token_id from the gateway
  // auth envelope and deletes that one SESSION token via
  // AuthMutation.DeleteSessionToken. Idempotent.
  rpc Logout(LogoutReq) returns (LogoutResp) {
    option (w17.contrib.plugin_feature_rpc) = "authenticate_turnkey";
  }

  // CreateApiToken — issue an API/MCP token for the caller (bearer-
  // authenticated), optionally narrowed to a permission subset. Returns
  // the opaque token ONCE. Gated api_token.
  rpc CreateApiToken(CreateApiTokenReq) returns (CreateApiTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }
  // ListApiTokens — the caller's API tokens (management view, no secret).
  rpc ListApiTokens(ListApiTokensReq) returns (ListApiTokensResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }
  // RevokeApiToken — delete the caller's own API token + its subset rows.
  rpc RevokeApiToken(RevokeApiTokenReq) returns (RevokeApiTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "api_token";
  }

  // ── oauth — authorize-redirect + callback ───────────────────
  // OAuthAuthorizeURL builds the IdP authorize URL (client redirects);
  // OAuthCallback exchanges the code, find-or-creates the user, and issues
  // a session. Both unauthenticated. Gated oauth.
  rpc OAuthAuthorizeURL(OAuthAuthorizeURLReq) returns (OAuthAuthorizeURLResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
  }
  rpc OAuthCallback(OAuthCallbackReq) returns (OAuthCallbackResp) {
    option (w17.contrib.plugin_feature_rpc) = "oauth";
  }

  // ── two_factor — enrollment + challenge verification ────────
  // EnrollTotp / ConfirmTotp / DisableTotp / GetMfaStatus ride the bearer
  // middleware (manage your own factor). VerifyMfa is unauthenticated
  // (challenge_id stands in for the not-yet-issued token). All gated
  // two_factor.
  rpc EnrollTotp(EnrollTotpReq) returns (EnrollTotpResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }
  rpc ConfirmTotp(ConfirmTotpReq) returns (ConfirmTotpResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }
  rpc DisableTotp(DisableTotpReq) returns (DisableTotpResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }
  rpc GetMfaStatus(GetMfaStatusReq) returns (GetMfaStatusResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }
  rpc VerifyMfa(VerifyMfaReq) returns (VerifyMfaResp) {
    option (w17.contrib.plugin_feature_rpc) = "two_factor";
  }

  // ── devices management — list + log out one/others/all ──────
  // ListDevices — the caller's devices (mgmt view, derived trusted /
  // current). RevokeDevice — log out one device (delete its tokens +
  // the Device row). RevokeOtherDevices — log out every device but the
  // caller's. RevokeAllDevices — log out everywhere (incl. caller).
  // All gated `devices`.
  rpc ListDevices(ListDevicesReq) returns (ListDevicesResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
  }
  rpc RevokeDevice(RevokeDeviceReq) returns (RevokeDeviceResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
  }
  rpc RevokeOtherDevices(RevokeOtherDevicesReq) returns (RevokeOtherDevicesResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
  }
  rpc RevokeAllDevices(RevokeAllDevicesReq) returns (RevokeAllDevicesResp) {
    option (w17.contrib.plugin_feature_rpc) = "devices";
  }

  // ── password_reset — request + apply (E1) ───────────────────
  // RequestPasswordReset (unauthenticated) mints + e-mails a reset token;
  // it ALWAYS returns success regardless of whether the email exists
  // (anti-enumeration). ResetPassword (unauthenticated) consumes the token,
  // sets the new password, and revokes every existing session. Gated
  // `password_reset`.
  rpc RequestPasswordReset(RequestPasswordResetReq) returns (RequestPasswordResetResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
  }
  rpc ResetPassword(ResetPasswordReq) returns (ResetPasswordResp) {
    option (w17.contrib.plugin_feature_rpc) = "password_reset";
  }

  // ── email_verification — request + confirm (E1) ─────────────
  // RequestEmailVerification (bearer-authenticated — you verify your own
  // address) mints + e-mails a verification token. VerifyEmail
  // (unauthenticated — the link click carries no session) consumes the
  // token and stamps email_verified_at. Gated `email_verification`.
  rpc RequestEmailVerification(RequestEmailVerificationReq) returns (RequestEmailVerificationResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
  }
  rpc VerifyEmail(VerifyEmailReq) returns (VerifyEmailResp) {
    option (w17.contrib.plugin_feature_rpc) = "email_verification";
  }

  // ── cli_login — first-party CLI OAuth (loopback + PKCE) ─────
  // CliAuthorize (bearer-authenticated — the user is signed into the web)
  // mints a single-use authorization code bound to the principal + the
  // CLI's PKCE challenge; the console web then redirects the browser to the
  // CLI's loopback redirect_uri?code=<code>. CliToken (unauthenticated —
  // the CLI has no token yet) verifies the PKCE verifier, consumes the
  // code, and mints the bearer the CLI stores. Gated `cli_login`. See
  // docs/specs/plugins/auth-cli-login-and-orgs.md.
  rpc CliAuthorize(CliAuthorizeReq) returns (CliAuthorizeResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }
  rpc CliToken(CliTokenReq) returns (CliTokenResp) {
    option (w17.contrib.plugin_feature_rpc) = "cli_login";
  }

  // ── org_membership — list the caller's organizations ───────
  // ListMyOrgs returns the orgs the bearer-authenticated caller belongs to
  // (for the CLI's `org list` + the login-time membership cache + the init
  // org picker). The principal is the gateway-resolved caller (never a
  // client-sent user_id). Gated `org_membership`.
  rpc ListMyOrgs(ListMyOrgsReq) returns (ListMyOrgsResp) {
    option (w17.contrib.plugin_feature_rpc) = "org_membership";
  }
}

// ── password_reset / email_verification business messages (E1) ──

message RequestPasswordResetReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string email = 1 [(w17.field) = { type: EMAIL, max_len: 320 }];
}
message RequestPasswordResetResp {
  option (w17.contrib.plugin_feature) = "password_reset";
  // Intentionally empty: a uniform success regardless of whether the email
  // exists (anti-enumeration).
}

message ResetPasswordReq {
  option (w17.contrib.plugin_feature) = "password_reset";
  string token        = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
  string new_password = 2 [(w17.field) = { type: PASSWORD }];
}
message ResetPasswordResp {
  option (w17.contrib.plugin_feature) = "password_reset";
}

message RequestEmailVerificationReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  // No fields: the caller is the bearer-authenticated principal (their
  // user_id + email come from the session, like WhoAmI).
}
message RequestEmailVerificationResp {
  option (w17.contrib.plugin_feature) = "email_verification";
}

message VerifyEmailReq {
  option (w17.contrib.plugin_feature) = "email_verification";
  string token = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message VerifyEmailResp {
  option (w17.contrib.plugin_feature) = "email_verification";
}

// ── cli_login business messages (first-party CLI OAuth) ─────

message CliAuthorizeReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  // PKCE code_challenge = BASE64URL(SHA256(code_verifier)) (S256 only).
  string code_challenge = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
  // The loopback callback the CLI is listening on
  // (http://127.0.0.1:PORT/... or http://localhost:PORT/...). Restricted
  // to loopback so a stolen authorize link can't exfiltrate the code to an
  // attacker origin (RFC 8252 §7.3).
  string redirect_uri = 2 [(w17.field) = { type: URL, max_len: 512 }];
}
message CliAuthorizeResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  // The single-use authorization code; the console web redirects the
  // browser to redirect_uri?code=<code>, where the CLI's loopback server
  // receives it and redeems it at CliToken.
  string code = 1;
  // Echoed back so the web front-end builds the redirect without re-reading
  // the request.
  string redirect_uri = 2;
}

message CliTokenReq {
  option (w17.contrib.plugin_feature) = "cli_login";
  string code = 1 [(w17.field) = { type: CHAR, max_len: 128 }];
  // PKCE code_verifier (RFC 7636: 43–128 chars of the unreserved set).
  string code_verifier = 2 [(w17.field) = { type: CHAR, max_len: 128 }];
}
message CliTokenResp {
  option (w17.contrib.plugin_feature) = "cli_login";
  string token   = 1; // opaque bearer the CLI stores in ~/.w17/auth.yaml
  string user_id = 2;
}

// ── org_membership business messages (multi-org) ────────────

message ListMyOrgsReq {
  option (w17.contrib.plugin_feature) = "org_membership";
  // No fields: the caller is the bearer-authenticated principal (their
  // user_id comes from the session, like WhoAmI).
}
message ListMyOrgsResp {
  option (w17.contrib.plugin_feature) = "org_membership";
  // Reuses the query-tier view (this proto imports queries/auth_query.proto).
  repeated UserOrg orgs = 1;
}
